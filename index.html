<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#34c759">
<meta name="apple-mobile-web-app-title" content="カロリー">

<link rel="apple-touch-icon" href="icons/icon-180.png">

<title>カロリー収支ノート</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--sub:#6c6c70;--line:#e5e5ea;--pri:#248a3d;--pri-bg:#34c759;--over:#c2410c;--under:#0369a1;--ok:#15803d;--warn:#a16207}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
h2{font-size:1.2rem;font-weight:700;margin:.2rem 0 .6rem}
h3{font-size:1rem;margin:.8rem 0 .4rem}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--sub);margin:8px 0 2px}
input,select,textarea,button{font:inherit;font-size:16px}
input,select,textarea{width:100%;padding:10px 12px;border:0;border-radius:10px;background:#f2f2f7;color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pri-bg)}
input[type=date]{display:block;min-width:0;max-width:100%;min-height:42px;-webkit-appearance:none;appearance:none;text-align:left}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{border:0;background:#e8f7ec;border-radius:10px;padding:10px 14px;color:var(--pri);font-weight:600;cursor:pointer}
button:active{opacity:.6}
button.pri{background:var(--pri-bg);color:#fff}
button.danger{color:#b91c1c}
button.sm{padding:4px 8px;font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(249,249,249,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid #c6c6c8;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;padding:12px 2px;font-size:.78rem;font-weight:500;background:transparent;color:var(--sub)}
nav button.on{color:var(--pri);font-weight:700}
.datebar{display:flex;gap:6px;align-items:center;margin-bottom:10px}.datebar input{flex:1}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.95rem;border:2px solid currentColor}
.over{color:var(--over)}.under{color:var(--under)}.maintain{color:var(--ok)}.prov,.unrec,.insuf{color:var(--warn)}
.big{font-size:2rem;font-weight:700;line-height:1.2}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sum td{font-weight:700}
.small{font-size:.8rem;color:var(--sub)}
.note{background:#fff8e6;border-radius:10px;padding:8px;font-size:.85rem;margin:8px 0}
.err{background:#fee2e2;border-color:#fca5a5}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item>div:first-child{min-width:0;flex:1;overflow-wrap:anywhere;word-break:break-word}
td{overflow-wrap:anywhere}
.item .acts{display:flex;gap:4px;flex-shrink:0;align-items:flex-start}
.chart{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px}
.col{flex:1 0 46px;text-align:center;font-size:.7rem;min-width:46px;background:transparent;border-radius:8px;padding:4px 0;color:var(--tx);font-weight:400;display:flex;flex-direction:column;gap:2px}
.col.sel{background:#e8f7ec;box-shadow:inset 0 0 0 2px var(--pri-bg)}
.col .dt{color:var(--sub);font-size:.68rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.tile{background:#f2f2f7;border-radius:12px;padding:10px 12px}
.tile span{display:block;font-size:.78rem;color:var(--sub)}
.tile b{font-size:1.5rem;font-weight:700}.tile small{color:var(--sub);margin-left:3px}
.seg{display:flex;background:#f2f2f7;border-radius:10px;padding:2px;margin:8px 0}
.seg button{flex:1;background:transparent;color:var(--sub);padding:6px;border-radius:8px;font-size:.9rem}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stats div{background:#f2f2f7;border-radius:10px;padding:6px;text-align:center}
.stats span{display:block;font-size:.65rem;color:var(--sub)}.stats b{font-size:.95rem}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;font-size:.72rem;color:var(--sub)}
.cc{min-height:62px;border-radius:8px;background:#f2f2f7;padding:3px 1px;text-align:center;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--tx);font-weight:400}
.cc.empty{background:transparent}
.cc i{font-style:normal;color:var(--sub);font-size:.7rem}.cc b{font-size:.78rem}.cc span{font-size:.58rem;white-space:nowrap}
.cc.sel{box-shadow:inset 0 0 0 2.5px var(--pri-bg)}.cc.tod i{color:var(--pri);font-weight:700;text-decoration:underline}
.bg-over{background:#fdeee6}.bg-under{background:#e5f2fa}.bg-maintain{background:#e6f6ea}.bg-prov{background:#fff8e6}
table td{padding:9px 4px}
.bars{position:relative;height:150px;border-bottom:0}
.bars::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--sub)}
.bar{position:absolute;left:18%;right:18%;border-radius:3px}
.bar.over{background:var(--over)}.bar.under{background:var(--under)}.bar.maintain{background:var(--ok);height:3px!important}
.bar.prov{background:repeating-linear-gradient(45deg,#fff 0 3px,currentColor 3px 5px);border:1.5px dashed currentColor;background-color:#fff}
.mark{position:absolute;left:0;right:0;top:calc(50% - 10px);color:var(--warn);font-size:.7rem}
.col b{display:block;font-size:.8rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#1d2733;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px;background:#f2f2f7;border-radius:10px;margin:6px 0;accent-color:var(--pri-bg)}
.opt input{width:auto;margin-top:5px}
.opt label{margin:0;color:var(--tx);font-size:.95rem}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;font-size:.8rem;background:#f1f5f9;padding:8px;border-radius:8px}
.exrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:4px;margin:4px 0}
.exrow input{padding:7px 4px}
#auth{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px}
#auth.on{display:block}
button:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:99px;background:#eee;color:#444;margin:2px 4px 0 0}
.tag.ok{background:#e6f6ea;color:#1b6e34}.tag.warn{background:#fff3d6;color:#8a5a00}
#report{display:none;position:fixed;inset:0;background:#fff;overflow:auto;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 14px 40px;color:#000}
#report.on{display:block}
.rbar{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;background:#fff;padding:6px 0}
#report h1{font-size:1.3rem;margin:0 0 4px}#report h2{font-size:1.05rem;margin:16px 0 6px;border-bottom:2px solid #34c759;padding-bottom:2px}
#report table{font-size:.78rem}#report th,#report td{border:1px solid #bbb;padding:3px 5px;text-align:left}#report td.n,#report th.n{text-align:right}
#report th{background:#eaf7ee}
#report .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
#report .tw td,#report .tw th{white-space:nowrap}
@media (max-width:480px){#report .tw table{font-size:.66rem}#report .tw th,#report .tw td{padding:3px 2px}#report .hm{display:none}}
#report .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:.85rem}
#report .dd{font-size:.8rem;margin:0 0 6px;break-inside:avoid;overflow-wrap:anywhere}
@media print{
  @page{margin:12mm}
  body>*:not(#report){display:none!important}
  body{padding:0;background:#fff}
  #report{position:static;overflow:visible;padding:0;display:block!important}
  .rbar{display:none}
  tr{break-inside:avoid}
  #report .hm{display:table-cell!important}
}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<div id="report"></div>
<div id="auth"></div>

<!-- ============ 計算モジュール（DOM・保存に依存しない純粋関数） ============ -->
<script id="calc-js">
const Calc = (() => {
  // 日常活動係数: 筋トレ（記録するセッション）を「含まない」日常動作のみを想定
  const ACTIVITY = [
    {id:'sedentary', label:'ほぼ座位', pal:1.2, ex:'デスクワーク・在宅中心。移動は電車や車が主で、1日の歩行が少ない'},
    {id:'light', label:'やや活動的', pal:1.3, ex:'事務職で通勤や買い物で歩く。1日の歩数 約5,000〜8,000歩'},
    {id:'moderate', label:'活動的', pal:1.4, ex:'接客・営業・教職など立ち歩きが多い。1日の歩数 約8,000〜12,000歩'},
    {id:'high', label:'とても活動的', pal:1.5, ex:'配達・介護・調理など、勤務中ほぼ動き続ける仕事（肉体労働は含まない）'}
  ];
  // MET: 2024 Adult Compendium of Physical Activities
  const INTENSITY = [
    {id:'light', label:'軽め', met:3.5, code:'02054', desc:'複数種目を8〜15回、中程度の重量でテンポよく'},
    {id:'moderate', label:'ふつう', met:5.0, code:'02052', desc:'スクワット・デッドリフトなど大筋群中心、ゆっくり〜爆発的'},
    {id:'vigorous', label:'きつい', met:6.0, code:'02050', desc:'パワーリフティング・ボディビルの高強度'}
  ];
  const MEALS = [{id:'breakfast',label:'朝'},{id:'lunch',label:'昼'},{id:'dinner',label:'夜'},{id:'snack',label:'間食'}];

  const r1 = v => Math.round(v * 10) / 10;
  function parseDate(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
  function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function today(){ return fmtDate(new Date()); }
  function addDays(s, n){ const d = parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
  function ageOn(birth, dateStr){
    const b = parseDate(birth), d = parseDate(dateStr); if(!b||!d) return null;
    let a = d.getFullYear()-b.getFullYear();
    if (d.getMonth()<b.getMonth() || (d.getMonth()===b.getMonth() && d.getDate()<b.getDate())) a--;
    return a;
  }
  // Mifflin-St Jeor (1990)
  function bmr({weightKg, heightCm, age, sex}){
    return 10*weightKg + 6.25*heightCm - 5*age + (sex==='male' ? 5 : -161);
  }
  // 基準量に対する割合でkcalを算出
  function scaleKcal(baseKcal, baseAmount, amount){ return baseKcal * amount / baseAmount; }

  // 筋トレ消費: 手入力があればそれを採用。なければ (MET-1)×体重×時間。種目単位では加算しない。
  function workoutKcal(w, weightKg){
    if (w.kcalOverride != null) return {kcal:w.kcalOverride, method:'manual'};
    if (!w.metUsed) return {kcal:0, method:'none', reason:'intensity'};
    if (!weightKg) return {kcal:0, method:'none', reason:'weight'};
    if (!w.durationMin) return {kcal:0, method:'none', reason:'duration'};
    return {kcal:(w.metUsed-1)*weightKg*(w.durationMin/60), method:'met'};
  }
  function missingFields(cond, date){
    const m = [];
    if (!cond) return ['身長','性別','生年月日','体重','日常活動レベル'];
    if (!(cond.heightCm>0)) m.push('身長');
    if (cond.sex!=='male' && cond.sex!=='female') m.push('性別');
    const a = ageOn(cond.birthDate, date);
    if (a==null || a<0 || a>120) m.push('生年月日');
    if (!(cond.weightKg>0)) m.push('体重');
    if (!ACTIVITY.some(x=>x.id===cond.activityId)) m.push('日常活動レベル');
    return m;
  }
  function dayBalance(date, day, cond){
    day = day || {meals:[], workouts:[], mealsComplete:false};
    const meals = day.meals||[], workouts = day.workouts||[];
    const intake = meals.reduce((s,m)=>s+m.kcal,0);
    const missing = missingFields(cond, date);
    const out = {intake, mealCount:meals.length, missing, status:'', diff:null, bmr:null, daily:null, exercise:null, exerciseUncalculated:0, total:null, tol:cond?cond.tol:null};
    // 筋トレ追加消費は体重だけで算出できる。基礎代謝・収支の前提が不足して
    // いても、取得済みのHevy記録を「—」にせず表示する。
    out.exercise = workouts.reduce((s,w)=>s+workoutKcal(w, cond&&cond.weightKg).kcal,0);
    out.exerciseUncalculated = workouts.filter(w=>workoutKcal(w, cond&&cond.weightKg).method==='none').length;
    if (missing.length){ out.status='insufficient'; return out; }
    const b = bmr({weightKg:cond.weightKg, heightCm:cond.heightCm, age:ageOn(cond.birthDate,date), sex:cond.sex});
    const pal = ACTIVITY.find(x=>x.id===cond.activityId).pal;
    out.pal = pal; out.bmr = b; out.daily = b*pal;
    out.total = out.daily + out.exercise;
    out.diff = intake - out.total;
    if (!day.mealsComplete) out.status = meals.length ? 'provisional' : 'unrecorded';
    else out.status = Math.abs(out.diff) <= cond.tol ? 'maintain' : (out.diff>0 ? 'over' : 'under');
    return out;
  }

  function selfTest(){
    const res = [], eq = (n,a,b)=>res.push({name:n, ok:Math.abs(a-b)<1e-6, detail:`期待 ${b} / 結果 ${a}`}), is=(n,a,b)=>res.push({name:n, ok:a===b, detail:`期待 ${b} / 結果 ${a}`});
    eq('ごはん156kcal/100g × 150g = 234kcal', scaleKcal(156,100,150), 234);
    eq('1食500kcal × 倍率0.5 = 250kcal', scaleKcal(500,1,0.5), 250);
    eq('卵 71kcal/個 × 2個 = 142kcal', scaleKcal(71,1,2), 142);
    eq('Mifflin 男性30歳 70kg 175cm = 1648.75', bmr({weightKg:70,heightCm:175,age:30,sex:'male'}), 1648.75);
    eq('Mifflin 女性30歳 55kg 160cm = 550+1000-150-161 = 1239', bmr({weightKg:55,heightCm:160,age:30,sex:'female'}), 1239);
    eq('筋トレ MET5.0 60分 70kg = (5-1)×70×1 = 280kcal', workoutKcal({durationMin:60,metUsed:5},70).kcal, 280);
    eq('手入力の消費kcalが優先される', workoutKcal({durationMin:60,metUsed:5,kcalOverride:300},70).kcal, 300);
    is('MET設定済み・体重未入力は体重不足として区別', workoutKcal({durationMin:60,metUsed:5},null).reason, 'weight');
    is('体重設定済み・MET未設定は強度不足として区別', workoutKcal({durationMin:60,metUsed:null},70).reason, 'intensity');
    is('誕生日前は年齢-1', ageOn('1990-12-31','2026-10-16'), 35);
    const cond = {heightCm:175, sex:'male', birthDate:'1996-01-01', weightKg:70, activityId:'sedentary', tol:100};
    const ex = [{name:'A',weightKg:60,reps:10,sets:3},{name:'B',weightKg:40,reps:10,sets:3},{name:'C',weightKg:20,reps:10,sets:3}];
    const wk = {durationMin:60, metUsed:5, exercises:ex, kcalOverride:null};
    const base = {mealsComplete:true, meals:[{kcal:2500}], workouts:[wk]};
    const b = dayBalance('2026-01-01', base, cond);
    eq('総消費=BMR×1.2+筋トレ280（種目数に依存しない）', b.total, 1648.75*1.2+280);
    eq('筋トレ追加は280のみ（二重計上なし）', b.exercise, 280);
    const onlyWeight = dayBalance('2026-01-01', base, {...cond, heightCm:null, activityId:''});
    is('収支条件が不足しても、体重があれば筋トレ追加消費は集計する', onlyWeight.exercise, 280);
    is('収支条件が不足した状態は情報不足のまま維持する', onlyWeight.status, 'insufficient');
    eq('差分=摂取2500-総消費2258.5=+241.5', b.diff, 241.5);
    is('差分>許容幅 → over', b.status, 'over');
    is('摂取1800 → under', dayBalance('2026-01-01',{mealsComplete:true,meals:[{kcal:1800}],workouts:[]},cond).status, 'under');
    is('差分が許容幅内 → maintain', dayBalance('2026-01-01',{mealsComplete:true,meals:[{kcal:1978}],workouts:[]},cond).status, 'maintain');
    is('未完了+記録あり → provisional', dayBalance('2026-01-01',{mealsComplete:false,meals:[{kcal:500}],workouts:[]},cond).status, 'provisional');
    is('未完了+記録なし → unrecorded（0kcalと断定しない）', dayBalance('2026-01-01',{mealsComplete:false,meals:[],workouts:[]},cond).status, 'unrecorded');
    is('完了+記録なし → 摂取0として判定(under)', dayBalance('2026-01-01',{mealsComplete:true,meals:[],workouts:[]},cond).status, 'under');
    is('体重なし → insufficient', dayBalance('2026-01-01',base,{...cond,weightKg:null}).status, 'insufficient');
    return res;
  }
  return {ACTIVITY, INTENSITY, MEALS, r1, parseDate, fmtDate, today, addDays, ageOn, bmr, scaleKcal, workoutKcal, missingFields, dayBalance, selfTest};
})();
</script>

<!-- ============ データ保存モジュール ============ -->
<script id="store-js">
const Store = (() => {
  const BASE_KEY = 'kcal-tracker-v1';
  let KEY = BASE_KEY;
  const SCHEMA = 1;
  const defaults = () => ({schemaVersion:SCHEMA, settings:{heightCm:null, sex:'', birthDate:'', activityId:'', tolerance:100, timezone:'Asia/Tokyo', hevyDefaultIntensity:null}, weights:{}, foods:[], exercises:[], days:{},
    hevy:{seq:0, generation:null, accountKey:null, templatesAt:null, lastSyncAt:null}});
  let data = defaults();
  let memoryOnly = false;

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const isNum = (v, min=0, max=Infinity) => typeof v==='number' && isFinite(v) && v>=min && v<=max;
  const isDate = s => typeof s==='string' && !!Calc.parseDate(s) && Calc.fmtDate(Calc.parseDate(s))===s;
  const str = (v, max=200) => typeof v==='string' ? v.slice(0,max) : '';

  // 形式検証と正規化。不正なら例外
  function validate(o){
    const bad = m => { throw new Error(m); };
    if (!o || typeof o!=='object' || Array.isArray(o)) bad('JSONの形式が不正です');
    if (o.schemaVersion !== SCHEMA) bad('対応していないバージョンです（schemaVersion='+o.schemaVersion+'）');
    const d = defaults();
    const s = o.settings||{};
    if (s.heightCm!=null && !isNum(s.heightCm,50,250)) bad('身長が不正です');
    if (s.sex && s.sex!=='male' && s.sex!=='female') bad('性別が不正です');
    if (s.birthDate && !isDate(s.birthDate)) bad('生年月日が不正です');
    if (s.activityId && !Calc.ACTIVITY.some(a=>a.id===s.activityId)) bad('活動レベルが不正です');
    if (s.tolerance!=null && !isNum(s.tolerance,0,2000)) bad('許容幅が不正です');
    d.settings = {heightCm:s.heightCm??null, sex:s.sex||'', birthDate:s.birthDate||'', activityId:s.activityId||'', tolerance:s.tolerance??100, timezone:s.timezone||'Asia/Tokyo', hevyDefaultIntensity:s.hevyDefaultIntensity||null};
    if (!validTz(d.settings.timezone)) bad('タイムゾーンが不正です');
    if (d.settings.hevyDefaultIntensity && !Calc.INTENSITY.some(i=>i.id===d.settings.hevyDefaultIntensity)) bad('Hevy既定強度が不正です');
    const hv = o.hevy||{};
    d.hevy = {seq:isNum(hv.seq)?hv.seq:0, generation:isNum(hv.generation)?hv.generation:null, accountKey:hv.accountKey?str(hv.accountKey,40):null, templatesAt:hv.templatesAt?str(hv.templatesAt,40):null, lastSyncAt:hv.lastSyncAt?str(hv.lastSyncAt,40):null};
    for (const [k,v] of Object.entries(o.weights||{})) { if(!isDate(k)||!isNum(v,20,300)) bad('体重記録が不正です: '+k); d.weights[k]=v; }
    d.foods = (o.foods||[]).map(f => validateFood(f, bad));
    for (const [k,day] of Object.entries(o.days||{})) {
      if (!isDate(k) || !day || typeof day!=='object') bad('日次データが不正です: '+k);
      const nd = {mealsComplete:!!day.mealsComplete, meals:[], workouts:[], cond:null};
      for (const m of day.meals||[]) {
        if (!Calc.MEALS.some(x=>x.id===m.meal) || !isNum(m.kcal) || !isNum(m.amount) || !isNum(m.baseAmount,1e-9) || !isNum(m.baseKcal)) bad('食事記録が不正です: '+k);
        nd.meals.push({id:str(m.id,40)||uid(), meal:m.meal, foodId:m.foodId?str(m.foodId,40):null, name:str(m.name), unit:str(m.unit,20), amount:m.amount, baseAmount:m.baseAmount, baseKcal:m.baseKcal, kcal:m.kcal, note:str(m.note,500)});
      }
      for (const w of day.workouts||[]) {
        const isHevy = !!w.source && w.source!=='manual';
        if (!isNum(w.durationMin,0,1440) || (w.metUsed==null ? !isHevy : !isNum(w.metUsed,1,30)) || (w.kcalOverride!=null && !isNum(w.kcalOverride,0,20000))) bad('筋トレ記録が不正です: '+k);
        const optNum = (v, max) => v==null ? null : (isNum(v,0,max) ? v : bad('セット情報が不正です: '+k));
        const exs = (w.exercises||[]).map(e => { if(!isNum(e.weightKg,0,1000)||!isNum(e.reps,0,1000)||!isNum(e.sets,0,1000)) bad('種目が不正です: '+k);
          const row = {name:str(e.name), weightKg:e.weightKg, reps:e.reps, sets:e.sets, exerciseId:e.exerciseId?str(e.exerciseId,60):null, hevyTemplateId:e.hevyTemplateId?str(e.hevyTemplateId,100):null};
          if (Array.isArray(e.setsDetail)) { row.setsDetail = e.setsDetail.slice(0,200).map(s => ({index:isNum(s.index,0,1000)?s.index:0, type:str(s.type,20), weightKg:optNum(s.weightKg,1000), reps:optNum(s.reps,10000), durationSeconds:optNum(s.durationSeconds,86400), distanceMeters:optNum(s.distanceMeters,1e7), rpe:optNum(s.rpe,10), customMetric:optNum(s.customMetric,1e6)})); row.derived = !!e.derived; row.supersetId = isNum(e.supersetId)?e.supersetId:null; row.notes = str(e.notes,500); }
          return row; });
        nd.workouts.push({id:str(w.id,40)||uid(), source:str(w.source,40)||'manual', externalId:w.externalId?str(w.externalId,100):null, importedAt:w.importedAt?str(w.importedAt,40):null, externalUpdatedAt:w.externalUpdatedAt?str(w.externalUpdatedAt,40):null,
          title:str(w.title), durationMin:w.durationMin, intensity:str(w.intensity,20), metUsed:w.metUsed??null, kcalOverride:w.kcalOverride??null, exercises:exs, note:str(w.note,500),
          ...(isHevy ? {accountKey:w.accountKey?str(w.accountKey,40):null, startTime:str(w.startTime,40), endTime:str(w.endTime,40), tz:str(w.tz,60), hevyNote:str(w.hevyNote,1000), durationBasis:str(w.durationBasis,40), calc:(w.calc&&typeof w.calc==='object')?{version:isNum(w.calc.version)?w.calc.version:1, method:str(w.calc.method,30), intensity:str(w.calc.intensity,20), met:isNum(w.calc.met)?w.calc.met:null, timeBasis:str(w.calc.timeBasis,40), note:str(w.calc.note,200), appliedAt:str(w.calc.appliedAt,40)}:null} : {})});
      }
      if (day.cond) {
        const c = day.cond;
        if (!isNum(c.heightCm,50,250)||!isNum(c.weightKg,20,300)||!isDate(c.birthDate)||(c.sex!=='male'&&c.sex!=='female')||!Calc.ACTIVITY.some(a=>a.id===c.activityId)||!isNum(c.tol,0,2000)) bad('保存済み計算条件が不正です: '+k);
        nd.cond = {heightCm:c.heightCm, sex:c.sex, birthDate:c.birthDate, weightKg:c.weightKg, activityId:c.activityId, tol:c.tol};
      }
      d.days[k] = nd;
    }
    if (o.exercises!=null && !Array.isArray(o.exercises)) bad('種目マスタが不正です');
    const seenEx = new Set();
    d.exercises = (o.exercises||[]).map(e => { const x = Ex.sanitizeEntry(e, bad); if (seenEx.has(x.id)) bad('種目マスタIDが重複しています'); seenEx.add(x.id); return x; });
    return d;
  }
  function validateFood(f, bad){
    if (!f || typeof f.name!=='string' || !f.name.trim() || !isNum(f.baseAmount,1e-9,100000) || !isNum(f.kcal,0,100000)) bad('マスタ項目が不正です');
    return {id:str(f.id,40)||uid(), name:str(f.name,100).trim(), baseAmount:f.baseAmount, unit:str(f.unit,20), kcal:f.kcal, note:str(f.note,500)};
  }

  const validTz = tz => { try { new Intl.DateTimeFormat('en-CA', {timeZone:tz}); return typeof tz==='string' && tz.length<=60; } catch(e){ return false; } };
  // アカウントごとに保存領域を分ける（別アカウントのデータが混ざらない）
  function setNamespace(ns){ KEY = BASE_KEY + (ns ? ':' + ns : ''); data = defaults(); }
  const legacyExists = () => { try { return !!localStorage.getItem(BASE_KEY); } catch(e){ return false; } };
  const hasOwnData = () => { try { return !!localStorage.getItem(KEY); } catch(e){ return false; } };
  function adoptLegacy(){ try { const raw = localStorage.getItem(BASE_KEY); if (!raw) return false; validate(JSON.parse(raw)); localStorage.setItem(KEY, raw); localStorage.removeItem(BASE_KEY); return true; } catch(e){ return false; } }

  function load(){
    try { const raw = localStorage.getItem(KEY); if (raw) data = validate(JSON.parse(raw)); }
    catch(e){ console.error(e); memoryOnly = !!(e && e.name==='SecurityError'); if(!memoryOnly) { try{ localStorage.setItem(KEY+'-corrupt', localStorage.getItem(KEY)); }catch(_){} } data = defaults(); }
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch(e){ memoryOnly = true; return false; } }

  function getDay(date){ return data.days[date] || {mealsComplete:false, meals:[], workouts:[], cond:null}; }
  function mutDay(date){ return data.days[date] || (data.days[date] = {mealsComplete:false, meals:[], workouts:[], cond:null}); }
  function weightFor(date){
    if (data.weights[date]!=null) return {kg:data.weights[date], date};
    const prev = Object.keys(data.weights).filter(k=>k<date).sort().pop();
    return prev ? {kg:data.weights[prev], date:prev} : null;
  }
  function liveCond(date){
    const s = data.settings, w = weightFor(date);
    return {heightCm:s.heightCm, sex:s.sex, birthDate:s.birthDate, weightKg:w?w.kg:null, activityId:s.activityId, tol:s.tolerance, weightDate:w?w.date:null};
  }
  // 計算条件が揃っていれば、その日に保存して以後の設定変更の影響を受けないようにする
  function lockCond(date){
    const day = mutDay(date);
    if (day.cond) return;
    const c = liveCond(date);
    if (!Calc.missingFields(c,date).length) { delete c.weightDate; day.cond = c; }
  }
  function condFor(date){ const d = data.days[date]; return {cond:(d&&d.cond)||liveCond(date), locked:!!(d&&d.cond)}; }
  function refreshCond(date){ const day = mutDay(date); day.cond = null; lockCond(date); }

  // Hevy等の外部取込用: source+externalId で重複判定して追加/スキップ
  function findWorkout(source, externalId){
    if (!externalId) return null;
    for (const [date,d] of Object.entries(data.days)) { const w = d.workouts.find(x=>x.source===source && x.externalId===externalId); if (w) return {date, workout:w}; }
    return null;
  }
  function importWorkouts(date, list){
    let added = 0, skipped = 0;
    for (const w of list) {
      if (findWorkout(w.source, w.externalId)) { skipped++; continue; }
      lockCond(date); mutDay(date).workouts.push({...w, id:uid(), importedAt:new Date().toISOString()}); added++;
    }
    save(); return {added, skipped};
  }

  return {
    get data(){ return data; }, get memoryOnly(){ return memoryOnly; },
    load, save, uid, validate, validateFood, defaults, getDay, mutDay, weightFor, liveCond, lockCond, condFor, refreshCond, findWorkout, importWorkouts, setNamespace, legacyExists, hasOwnData, adoptLegacy, validTz,
    replaceAll(o){ data = validate(o); save(); },
    exportAll(){ return JSON.stringify(data, null, 2); }
  };
})();
</script>

<!-- ============ 種目マスタ・Hevy対応モジュール（DOM非依存） ============ -->
<script id="ex-js">
const Ex = (() => {
  const FORMAT = 'hevy-exercise-templates';
  const SRC_NAME = '2024 Adult Compendium of Physical Activities';
  const SRC_URL = 'https://pacompendium.com/conditioning-exercise/';
  // 公式Compendium(Conditioning Exercise)の該当コード。種目単体のMETではなく「活動カテゴリ」の値。
  const CATALOG = [
    {code:'02050', met:6.0, label:'レジスタンス（フリーウェイト等）、パワーリフティング/ボディビル、高強度'},
    {code:'02052', met:5.0, label:'レジスタンス、スクワット・デッドリフト、ゆっくり〜爆発的'},
    {code:'02054', met:3.5, label:'レジスタンス、複数種目、8〜15回、負荷を変えながら'},
    {code:'02055', met:5.8, label:'レジスタンス、サーキット・交互スーパーセット'},
    {code:'02056', met:3.0, label:'自重レジスタンス、一般'},
    {code:'02057', met:6.5, label:'自重レジスタンス、高強度'}
  ];
  const TIME_DEF = 'カテゴリ全体に対する平均的な値。種目単独の動作時間・休憩の扱いは未検証';
  const str = (v, max=200) => typeof v==='string' ? v.slice(0,max) : '';
  const norm = s => String(s||'').normalize('NFKC').toLowerCase();

  const EQ = {barbell:['barbell','バーベル'], dumbbell:['dumbbell','ダンベル'], machine:['machine','マシン'], kettlebell:['kettlebell','ケトルベル'],
    resistance_band:['resistance band','バンド','チューブ'], suspension:['suspension','trx','サスペンション'], plate:['plate','プレート'], none:['bodyweight','body weight','自重']};
  const SMITH = ['smith','スミス'];
  const EQ_STOP = new Set(['barbell','バーベル','dumbbell','ダンベル','machine','マシン','kettlebell','ケトルベル','band','バンド','チューブ','suspension','trx','サスペンション','plate','プレート','bodyweight','自重','smith','スミス']);
  const detectEquip = t => {
    t = norm(t);
    if (SMITH.some(w=>t.includes(w))) return 'smith';
    for (const [k, ws] of Object.entries(EQ)) if (ws.some(w=>t.includes(w))) return k;
    return null;
  };
  const tokens = s => norm(s).split(/[^\p{L}\p{N}]+/u).filter(t => t.length>=2 && !EQ_STOP.has(t));

  const entryKey = h => h.isCustom ? `hevy-custom:${h.accountKey||'unknown'}:${h.templateId}` : `hevy:${h.templateId}`;
  const displayOf = e => e.displayName || (e.hevy ? e.hevy.title : e.name) || '';
  const namesOf = e => [e.hevy ? e.hevy.title : e.name, e.displayName, ...(e.aliases||[])].filter(Boolean);

  function parseFile(o){
    const bad = m => { throw new Error(m); };
    if (!o || typeof o!=='object' || Array.isArray(o)) bad('JSONの形式が不正です');
    if (o.format !== FORMAT) bad('Hevy種目JSONではありません（format が一致しません）');
    if (o.schemaVersion !== 1) bad('対応していないバージョンです（schemaVersion='+o.schemaVersion+'）');
    if (!Array.isArray(o.exercises)) bad('exercises 配列がありません');
    if (o.exercises.length > 20000) bad('件数が多すぎます');
    if (o.fetchedAt!=null && (typeof o.fetchedAt!=='string' || isNaN(Date.parse(o.fetchedAt)))) bad('fetchedAt が不正です');
    const seen = new Set(), items = [];
    o.exercises.forEach((x, i) => {
      const n = i+1;
      if (!x || typeof x!=='object' || Array.isArray(x)) bad(`${n}件目: 形式が不正です`);
      if (typeof x.hevyId!=='string' || !x.hevyId.trim() || x.hevyId.length>100) bad(`${n}件目: hevyId がありません`);
      if (typeof x.title!=='string' || !x.title.trim()) bad(`${n}件目: title がありません`);
      for (const k of ['type','primaryMuscleGroup','equipment','thumbnailUrl']) if (x[k]!=null && typeof x[k]!=='string') bad(`${n}件目: ${k} が不正です`);
      if (x.secondaryMuscleGroups!=null && !(Array.isArray(x.secondaryMuscleGroups) && x.secondaryMuscleGroups.every(s=>typeof s==='string'))) bad(`${n}件目: secondaryMuscleGroups が不正です`);
      if (x.isCustom!=null && typeof x.isCustom!=='boolean') bad(`${n}件目: isCustom が不正です`);
      let extra = (x.extra && typeof x.extra==='object' && !Array.isArray(x.extra)) ? x.extra : {};
      if (JSON.stringify(extra).length > 2000) extra = {_truncated:true};
      const h = {templateId:x.hevyId.trim(), title:str(x.title), type:x.type||null, primaryMuscleGroup:x.primaryMuscleGroup||null,
        secondaryMuscleGroups:(x.secondaryMuscleGroups||[]).map(s=>str(s,40)), equipment:x.equipment||null, isCustom:!!x.isCustom,
        thumbnailUrl:(typeof x.thumbnailUrl==='string' && /^https:\/\//.test(x.thumbnailUrl)) ? x.thumbnailUrl.slice(0,500) : null,
        extra, accountKey:o.accountKey ? str(o.accountKey,40) : null};
      const key = entryKey(h);
      if (seen.has(key)) bad(`${n}件目: 種目IDが重複しています（${h.templateId}）`);
      seen.add(key); items.push(h);
    });
    return {items, meta:{fetchedAt:o.fetchedAt||null, count:items.length, sample:!!o.sampleData, notice:str(o.notice,300)}};
  }
  const snap = h => JSON.stringify([h.templateId,h.title,h.type,h.primaryMuscleGroup,h.secondaryMuscleGroups,h.equipment,h.isCustom,h.thumbnailUrl,h.extra,h.accountKey]);

  function planImport(parsed, exercises){
    const byKey = new Map(exercises.filter(e=>e.source==='hevy').map(e=>[e.key, e]));
    const add = [], update = [], same = [], seen = new Set();
    for (const h of parsed.items) {
      const key = entryKey(h); seen.add(key);
      const cur = byKey.get(key);
      if (!cur) add.push({key, h});
      else if (snap(cur.hevy) !== snap(h)) update.push({key, h, entry:cur});
      else same.push({h, entry:cur});
    }
    const missing = [...byKey.values()].filter(e => !seen.has(e.key));
    return {add, update, same, missing, sample:parsed.meta.sample, fetchedAt:parsed.meta.fetchedAt};
  }
  // 追加・更新のみ。削除はしない。表示名・別名・推定方式・手動対応は触らない。
  function applyImport(plan, exercises, uid, fetchedAt){
    const at = fetchedAt || plan.fetchedAt || new Date().toISOString();
    const mark = h => ({...h, fetchedAt:at, inLatest:true, sample:!!plan.sample});
    for (const a of plan.add) exercises.push({id:'ex_'+uid(), source:'hevy', key:a.key, name:'', displayName:'', aliases:[], hevy:mark(a.h), estimation:{method:'unset'}, link:null});
    for (const u of plan.update) u.entry.hevy = mark(u.h);
    for (const s of plan.same) s.entry.hevy = mark(s.h);
    for (const m of plan.missing) m.hevy.inLatest = false;
  }

  function sanitizeEntry(e, bad){
    if (!e || typeof e!=='object') bad('種目マスタの形式が不正です');
    if (e.source!=='manual' && e.source!=='hevy') bad('種目の取得元が不正です');
    const id = str(e.id,60); if (!id) bad('種目IDがありません');
    const out = {id, source:e.source, key:str(e.key,200), name:str(e.name), displayName:str(e.displayName), aliases:Array.isArray(e.aliases)?e.aliases.map(a=>str(a,100)).filter(Boolean).slice(0,20):[], hevy:null, estimation:{method:'unset'}, link:null};
    if (e.source==='hevy') {
      const h = e.hevy;
      if (!h || typeof h.templateId!=='string' || !h.templateId || typeof h.title!=='string') bad('Hevy種目情報が不正です');
      out.hevy = {templateId:str(h.templateId,100), title:str(h.title), type:h.type?str(h.type,40):null, primaryMuscleGroup:h.primaryMuscleGroup?str(h.primaryMuscleGroup,40):null,
        secondaryMuscleGroups:Array.isArray(h.secondaryMuscleGroups)?h.secondaryMuscleGroups.map(s=>str(s,40)).filter(Boolean):[], equipment:h.equipment?str(h.equipment,40):null, isCustom:!!h.isCustom,
        thumbnailUrl:(typeof h.thumbnailUrl==='string' && /^https:\/\//.test(h.thumbnailUrl))?h.thumbnailUrl.slice(0,500):null,
        extra:(h.extra && typeof h.extra==='object' && !Array.isArray(h.extra))?h.extra:{}, accountKey:h.accountKey?str(h.accountKey,40):null,
        fetchedAt:h.fetchedAt?str(h.fetchedAt,40):null, inLatest:h.inLatest!==false, sample:!!h.sample};
      if (!out.key) out.key = entryKey(out.hevy);
    } else if (!out.name) bad('手入力種目の名前がありません');
    const s = e.estimation;
    if (s && (s.method==='category_met' || s.method==='user_met')) {
      if (!(typeof s.met==='number' && s.met>=1 && s.met<=30)) bad('種目のMET値が不正です');
      out.estimation = s.method==='category_met'
        ? {method:'category_met', basis:'compendium', code:str(s.code,20), met:s.met, categoryLabel:str(s.categoryLabel), sourceName:str(s.sourceName), sourceUrl:str(s.sourceUrl,300), mapping:'generic_category', energyBasis:'gross_met', timeDefinition:str(s.timeDefinition,300)}
        : {method:'user_met', basis:'user', met:s.met, note:str(s.note,300)};
    }
    if (e.link && e.link.state==='confirmed' && e.link.hevyKey) out.link = {state:'confirmed', hevyKey:str(e.link.hevyKey,200), confirmedAt:str(e.link.confirmedAt,40)};
    return out;
  }

  const catalogEstimation = code => {
    const c = CATALOG.find(x=>x.code===code); if (!c) return null;
    return {method:'category_met', basis:'compendium', code:c.code, met:c.met, categoryLabel:c.label, sourceName:SRC_NAME, sourceUrl:SRC_URL, mapping:'generic_category', energyBasis:'gross_met', timeDefinition:TIME_DEF};
  };
  const userEstimation = met => ({method:'user_met', basis:'user', met, note:'ユーザー独自設定（出典なし）'});
  const estimationMet = est => (est && est.method!=='unset' && typeof est.met==='number') ? est.met : null; // 未設定は 0 ではなく null
  const estimationLabel = est => !est || est.method==='unset' ? '推定方式未設定'
    : est.method==='category_met' ? `カテゴリMET ${est.met}（Compendium ${est.code}・汎用カテゴリへの対応）` : `ユーザー設定MET ${est.met}（出典なし）`;

  function resolveName(name, exercises){
    const n = norm(name).trim(); if (!n) return {entry:null, ambiguous:false};
    const hits = exercises.filter(e => namesOf(e).some(x => norm(x).trim()===n));
    if (hits.length===1) return {entry:hits[0], ambiguous:false};
    return {entry:null, ambiguous:hits.length>1};
  }
  function effective(entry, exercises){
    if (entry.estimation && entry.estimation.method!=='unset') return {est:entry.estimation, via:'self'};
    if (entry.link && entry.link.state==='confirmed') {
      const t = exercises.find(x=>x.key===entry.link.hevyKey);
      if (t && t.estimation && t.estimation.method!=='unset') return {est:t.estimation, via:'linked'};
    }
    return {est:{method:'unset'}, via:'none'};
  }
  // 記録の種目行。種目マスタIDがあれば名前より優先（Hevy由来は種目IDで対応）
  const labelForRow = (row, exercises) => {
    const entry = row.exerciseId && exercises.find(x=>x.id===row.exerciseId);
    return entry ? estimationLabel(effective(entry, exercises).est) : labelFor(row.name, exercises);
  };
  const labelFor = (name, exercises) => {
    const {entry, ambiguous} = resolveName(name, exercises);
    if (!entry) return ambiguous ? '推定方式未設定（種目名が複数のマスタと一致）' : '推定方式未設定（種目マスタ未登録）';
    return estimationLabel(effective(entry, exercises).est);
  };

  const candEquip = e => detectEquip(e.hevy.title)==='smith' ? 'smith' : ((e.hevy.equipment && e.hevy.equipment!=='other') ? e.hevy.equipment : detectEquip(e.hevy.title));
  // 名前と器具の両方で絞る。器具が違う/確認できない候補は出さない。自動確定はしない。
  function candidates(query, exercises, limit=5){
    const q = tokens(query), qe = detectEquip(query), out = [];
    if (!q.length) return out;
    for (const e of exercises) {
      if (e.source!=='hevy') continue;
      const ce = candEquip(e);
      if (qe && qe!==ce) continue;
      let best = 0;
      for (const nm of namesOf(e)) {
        const t = tokens(nm), inter = q.filter(x=>t.includes(x)).length, union = new Set([...q,...t]).size;
        best = Math.max(best, union ? inter/union : 0);
      }
      if (best >= 0.34) out.push({entry:e, score:best, equip:qe?'match':'unspecified'});
    }
    return out.sort((a,b)=>b.score-a.score).slice(0, limit);
  }
  function search(text, exercises, limit=20){
    const q = norm(text).trim(); if (!q) return [];
    return exercises.filter(e=>e.source==='hevy' && namesOf(e).some(n=>norm(n).includes(q))).slice(0, limit).map(e=>({entry:e, score:null, equip:null}));
  }
  function recordNames(days){
    const m = new Map();
    for (const d of Object.values(days)) for (const w of d.workouts) for (const e of w.exercises) { const n = (e.name||'').trim(); if (n) m.set(n, (m.get(n)||0)+1); }
    return m;
  }
  const manualFor = (name, exercises) => exercises.find(e => e.source==='manual' && namesOf(e).some(x=>norm(x).trim()===norm(name).trim()));
  function linkState(name, exercises){
    const m = manualFor(name, exercises);
    if (m && m.link && m.link.state==='confirmed') {
      const t = exercises.find(x=>x.key===m.link.hevyKey);
      if (t) return {state:'confirmed', target:t};
    }
    const c = candidates(name, exercises);
    return c.length ? {state:'candidate', cands:c} : {state:'unmapped'};
  }
  function confirmLink(name, hevyKey, exercises, uid){
    const target = exercises.find(x=>x.key===hevyKey && x.source==='hevy'); if (!target) throw new Error('対応先のHevy種目が見つかりません');
    let m = manualFor(name, exercises);
    if (!m) { m = {id:'ex_'+uid(), source:'manual', key:'', name:name.trim(), displayName:'', aliases:[], hevy:null, estimation:{method:'unset'}, link:null}; exercises.push(m); }
    m.link = {state:'confirmed', hevyKey, confirmedAt:new Date().toISOString()};
    return m;
  }
  function unlink(name, exercises){ const m = manualFor(name, exercises); if (m) m.link = null; }

  function selfTest(){
    const res = [], ok = (n,c,d='')=>res.push({name:n, ok:!!c, detail:d});
    let n = 0; const uid = () => 'u'+(++n);

    applyImport(planImport(parseFile(file([mk('C1','Other Account Custom',{isCustom:true})], {accountKey:'accB'})), ex2), ex2, uid);
    ok('カスタム種目IDはアカウントごとに別扱い（衝突しない）', ex2.length===2 && ex2[0].key!==ex2[1].key);

    ok('器具が違う候補（ダンベル・スミス）を同一視しない', c1.length===1 && c1[0].entry.hevy.templateId==='TEST-1', c1.map(c=>c.entry.hevy.templateId).join(','));
    const exAll = []; applyImport(planImport(parseFile(file(list3)), exAll), exAll, uid);
    const c2 = candidates('Test Bench Press', exAll);
    ok('器具未指定の名前は候補が複数出て、自動確定されない', c2.length===3 && c2.every(c=>c.equip==='unspecified') && linkState('Test Bench Press', exAll).state==='candidate');
    ok('名前だけ一致でも「未対応」は確定扱いにならない', linkState('全く別の種目', exAll).state==='unmapped');
    ok('推定方式未設定はnull（0kcal扱いしない）', estimationMet({method:'unset'})===null && labelFor('未登録の種目', exAll).includes('未設定'));
    ok('カテゴリMETは出典・コード付き、汎用カテゴリ対応と明示', catalogEstimation('02052').met===5.0 && catalogEstimation('02052').mapping==='generic_category' && catalogEstimation('02052').sourceUrl.includes('pacompendium'));
    const days = {'2026-01-01':{workouts:[{exercises:[{name:'ベンチプレス',weightKg:60,reps:8,sets:3}]}]}}, before = JSON.stringify(days);
    applyImport(planImport(parseFile(file(list3)), ex), ex, uid);

    ok('保存形式の往復（sanitize）で内容が保たれる', JSON.stringify(ex.map(e=>sanitizeEntry(e, m=>{throw new Error(m);})).map(e=>e.id))===JSON.stringify(ex.map(e=>e.id)));
    return res;
  }
  return {FORMAT, CATALOG, SRC_NAME, SRC_URL, TIME_DEF, entryKey, displayOf, namesOf, parseFile, planImport, applyImport, sanitizeEntry, catalogEstimation, userEstimation, estimationMet, estimationLabel,
    resolveName, effective, labelFor, labelForRow, candidates, search, recordNames, manualFor, linkState, confirmLink, unlink, detectEquip, selfTest};

<!-- ============ Hevy同期の反映ロジック（DOM・通信に非依存） ============ -->
<script id="hevysync-js">
const HevySync = (() => {
  const CALC_VERSION = 1;
  const dateInTz = (iso, tz) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date(iso)).map(x=>[x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}`;
  };
  const timeInTz = (iso, tz) => new Intl.DateTimeFormat('ja-JP', {timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false}).format(new Date(iso));
  // 開始〜終了の経過分（休憩・待機を含む）。種目ごとの動作時間ではない。
  const elapsedMin = (s, e) => { const a = Date.parse(s), b = Date.parse(e); return (isFinite(a) && isFinite(b) && b > a) ? Math.round((b-a)/6000)/10 : 0; };
  const num = v => (typeof v==='number' && isFinite(v)) ? v : null;
  const working = sets => sets.filter(s => s.type !== 'warmup');

  function mapExercise(ex, accountKey, exercises){
    const sets = (Array.isArray(ex.sets) ? ex.sets : []).slice().sort((a,b)=>(a.index??0)-(b.index??0)).map((s, i) => ({
      index:num(s.index) ?? i, type:typeof s.type==='string' ? s.type : 'normal', weightKg:num(s.weight_kg), reps:num(s.reps),
      durationSeconds:num(s.duration_seconds), distanceMeters:num(s.distance_meters), rpe:num(s.rpe), customMetric:num(s.custom_metric)}));
    const w = working(sets), top = w.filter(s=>s.weightKg!=null).sort((a,b)=>b.weightKg-a.weightKg)[0];
    const tid = typeof ex.exercise_template_id==='string' ? ex.exercise_template_id : null;
    const entry = tid && exercises.find(e => e.source==='hevy' && e.hevy.templateId===tid && (!e.hevy.isCustom || e.hevy.accountKey===accountKey));
    return {name:String(ex.title||'').slice(0,200), weightKg:top ? top.weightKg : 0, reps:top ? (top.reps||0) : 0, sets:w.length, exerciseId:entry ? entry.id : null, hevyTemplateId:tid,
      setsDetail:sets, derived:true, supersetId:num(ex.superset_id), notes:typeof ex.notes==='string' ? ex.notes.slice(0,500) : ''};
  }

  // Hevyのワークアウト → アプリの記録。ユーザー側の補正(強度・手入力kcal・メモ)は existing から引き継ぐ。
  function toLocal(w, ctx){
    const ex = ctx.existing, tz = (ex && ex.tz) || ctx.tz || 'Asia/Tokyo';
    const rec = {id:ex ? ex.id : ctx.uid(), source:'hevy', externalId:w.id, accountKey:ctx.accountKey, importedAt:ctx.nowIso, externalUpdatedAt:typeof w.updated_at==='string' ? w.updated_at : null,
      title:String(w.title||'').slice(0,200), hevyNote:typeof w.description==='string' ? w.description.slice(0,1000) : '', startTime:w.start_time, endTime:typeof w.end_time==='string' ? w.end_time : '', tz,
      durationMin:elapsedMin(w.start_time, w.end_time), durationBasis:'elapsed_incl_rest',
      exercises:(Array.isArray(w.exercises) ? w.exercises.slice().sort((a,b)=>(a.index??0)-(b.index??0)) : []).map(e=>mapExercise(e, ctx.accountKey, ctx.exercises || [])),
      intensity:'', metUsed:null, kcalOverride:null, note:'', calc:null};
    if (ex) {
      rec.intensity = ex.intensity; rec.metUsed = ex.metUsed; rec.kcalOverride = ex.kcalOverride; rec.note = ex.note; rec.calc = ex.calc;
      // 旧版データには強度IDだけが保存され、METが空の記録がある。
      // 有効な強度をユーザーが選んでいた場合は、その選択を維持して補完する。
      const oldIt = Calc.INTENSITY.find(i=>i.id===rec.intensity);
      if (oldIt && rec.metUsed==null) {
        rec.metUsed = oldIt.met;
        rec.calc = {version:CALC_VERSION, method:'session_met', intensity:oldIt.id, met:oldIt.met, timeBasis:'elapsed_incl_rest', note:'保存済み強度からMETを復元', appliedAt:ctx.nowIso};
      }
    }
    else if (ctx.defaultIntensity) {
      const it = Calc.INTENSITY.find(i=>i.id===ctx.defaultIntensity);
      if (it) { rec.intensity = it.id; rec.metUsed = it.met; rec.calc = {version:CALC_VERSION, method:'session_met', intensity:it.id, met:it.met, timeBasis:'elapsed_incl_rest', note:'取り込み時の既定強度', appliedAt:ctx.nowIso}; }
    }
    return rec;
  }
  function findRecord(days, accountKey, externalId){
    for (const [date, d] of Object.entries(days)) { const i = d.workouts.findIndex(x=>x.source==='hevy' && x.externalId===externalId && x.accountKey===accountKey); if (i>=0) return {date, i}; }
    return null;
  }
  // 変更を1件ずつ反映。再実行しても重複せず、削除はHevy由来の記録だけに作用する。
  function applyChanges(data, changes, ctx){
    const res = {added:0, updated:0, moved:0, deleted:0};
    for (const ch of changes) {
      const found = findRecord(data.days, ctx.accountKey, ch.workoutId);
      if (ch.kind === 'delete') { if (found) { data.days[found.date].workouts.splice(found.i, 1); res.deleted++; } continue; }
      const w = ch.workout, existing = found ? data.days[found.date].workouts[found.i] : null;
      const rec = toLocal(w, {...ctx, existing, exercises:data.exercises});
      const date = dateInTz(w.start_time, rec.tz);
      if (found && found.date === date) { data.days[date].workouts[found.i] = rec; res.updated++; continue; }
      if (found) { data.days[found.date].workouts.splice(found.i, 1); res.moved++; } else res.added++;
      const day = data.days[date] || (data.days[date] = {mealsComplete:false, meals:[], workouts:[], cond:null});
      day.workouts.push(rec);
      if (ctx.onDate) ctx.onDate(date);
    }
    return res;
  }
  function purge(data, accountKey){
    let n = 0;
    for (const d of Object.values(data.days)) { const before = d.workouts.length; d.workouts = d.workouts.filter(w => !(w.source==='hevy' && (accountKey==null || w.accountKey===accountKey))); n += before - d.workouts.length; }
    return n;
  }
  function applyDefaultIntensity(data, intensityId, nowIso){
    const it = Calc.INTENSITY.find(i=>i.id===intensityId); let n = 0;
    if (!it) return 0;
    for (const d of Object.values(data.days)) for (const w of d.workouts) if (w.source==='hevy' && w.kcalOverride==null && w.metUsed==null) {
      // 強度名だけが残る旧データは、その選択を尊重してMETを復元する。
      const chosen = Calc.INTENSITY.find(i=>i.id===w.intensity) || it;
      w.intensity = chosen.id; w.metUsed = chosen.met; w.calc = {version:CALC_VERSION, method:'session_met', intensity:chosen.id, met:chosen.met, timeBasis:'elapsed_incl_rest', note:'未計算の記録へ既定強度を適用', appliedAt:nowIso}; n++;
    }
    return n;
  }
  // サーバーが返すテンプレート(Hevy生の項目)を既存の種目マスタ取り込み形式へ。画像URLは扱わない。
  const templatesToFile = (list, accountKey, fetchedAt) => ({format:Ex.FORMAT, schemaVersion:1, fetchedAt, accountKey,
    exercises:list.filter(t=>t && typeof t.id==='string' && typeof t.title==='string').map(t=>({hevyId:t.id, title:t.title, type:t.type??null, primaryMuscleGroup:t.primary_muscle_group??null,
      secondaryMuscleGroups:Array.isArray(t.secondary_muscle_groups) ? t.secondary_muscle_groups.filter(s=>typeof s==='string') : [], equipment:t.equipment??null, isCustom:t.is_custom===true, thumbnailUrl:null, extra:{}}))});

  // 種目の集計値。Hevy由来はセット詳細から、手入力は 重量×回数×セット から。
  function exStats(e){
    if (Array.isArray(e.setsDetail)) {
      const w = working(e.setsDetail).filter(s=>s.weightKg!=null && s.reps!=null);
      return {max:w.reduce((m,s)=>Math.max(m,s.weightKg),0), vol:w.reduce((a,s)=>a+s.weightKg*s.reps, 0), rm:w.reduce((m,s)=>Math.max(m,s.weightKg*(1+s.reps/30)),0), sets:working(e.setsDetail).length};
    }
    return {max:e.weightKg, vol:e.weightKg*e.reps*e.sets, rm:e.weightKg*(1+e.reps/30), sets:e.sets};
  }

  function selfTest(){
    const res = [], ok = (n,c,d='')=>res.push({name:n, ok:!!c, detail:d});
    let n = 0; const uid = () => 'h'+(++n), nowIso = '2026-03-01T00:00:00Z';
    const hw = (id, o={}) => ({id, title:'Fictional Push Day', description:null, start_time:'2026-02-10T14:30:00Z', end_time:'2026-02-10T15:20:00Z', updated_at:'2026-02-10T15:21:00Z',
      exercises:[{index:1, title:'Fictional Fly', exercise_template_id:'TEST-0002', sets:[{index:0, type:'normal', weight_kg:20, reps:12}]},
        {index:0, title:'Fictional Bench Press (Barbell)', exercise_template_id:'TEST-0001', sets:[{index:1, type:'normal', weight_kg:60, reps:8, rpe:8}, {index:0, type:'warmup', weight_kg:40, reps:10}]}], ...o});
    const mk = () => ({days:{}, exercises:[]}), ctx = (o={}) => ({accountKey:'acct1', tz:'Asia/Tokyo', defaultIntensity:null, uid, nowIso, ...o});
    ok('日付: UTC 14:30 は東京では翌日、NYでは当日', dateInTz('2026-01-01T15:30:00Z','Asia/Tokyo')==='2026-01-02' && dateInTz('2026-01-01T15:30:00Z','America/New_York')==='2026-01-01');
    ok('日またぎは開始日に集計（東京23:30開始→当日）', dateInTz('2026-01-01T14:30:00Z','Asia/Tokyo')==='2026-01-01');
    ok('経過時間: 14:30〜15:20 = 50分（休憩含む経過）', elapsedMin('2026-02-10T14:30:00Z','2026-02-10T15:20:00Z')===50 && elapsedMin('2026-02-10T15:20:00Z','2026-02-10T14:30:00Z')===0);
    const d = mk(); const r1 = applyChanges(d, [{kind:'upsert', workoutId:'W1', workout:hw('W1')}], ctx());
    const rec = d.days['2026-02-10'].workouts[0];
    ok('取り込み: 開始時刻(UTC)を東京日付 2026-02-10 に集計し、1件追加', r1.added===1 && Object.keys(d.days).join()==='2026-02-10' && rec.source==='hevy' && rec.externalId==='W1');
    ok('種目・セットを順序どおり保持（index順）。重量kg・回数・RPEが保たれる', rec.exercises[0].name==='Fictional Bench Press (Barbell)' && rec.exercises[0].setsDetail[0].type==='warmup' && rec.exercises[0].setsDetail[1].weightKg===60 && rec.exercises[0].setsDetail[1].rpe===8);
    ok('ウォームアップは作業セット数から除外（要約値）', rec.exercises[0].sets===1 && rec.exercises[0].weightKg===60 && rec.exercises[0].derived===true);
    ok('種目ごとの動作時間は補わない（経過時間を割り当てない）', rec.exercises.every(e=>e.durationMin===undefined && e.durationSeconds===undefined) && rec.durationBasis==='elapsed_incl_rest');
    ok('強度未設定は未計算（method none、0kcalと区別）', Calc.workoutKcal(rec, 70).method==='none' && rec.metUsed===null);
    const d2 = mk(); applyChanges(d2, [{kind:'upsert', workoutId:'W1', workout:hw('W1')}], ctx({defaultIntensity:'moderate'}));
    const r2 = d2.days['2026-02-10'].workouts[0], k2 = Calc.workoutKcal(r2, 70);
    ok('既定強度(ふつう MET5.0)なら (5-1)×70kg×50/60h = 233.3kcal、方式・版を保存', Math.abs(k2.kcal-233.333)<0.01 && r2.calc.method==='session_met' && r2.calc.version===1 && r2.calc.timeBasis==='elapsed_incl_rest', String(k2.kcal));
    applyChanges(d2, [{kind:'upsert', workoutId:'W1', workout:hw('W1')}], ctx({defaultIntensity:'light'}));
    ok('再同期で重複しない・既定強度の設定変更で既存記録は変わらない', d2.days['2026-02-10'].workouts.length===1 && d2.days['2026-02-10'].workouts[0].metUsed===5.0);
    const w0 = d2.days['2026-02-10'].workouts[0]; w0.kcalOverride = 250; w0.note = '補正メモ'; w0.intensity = 'vigorous';
    applyChanges(d2, [{kind:'upsert', workoutId:'W1', workout:hw('W1', {title:'Fictional Edited', end_time:'2026-02-10T15:50:00Z'})}], ctx());
    const w1 = d2.days['2026-02-10'].workouts[0];
    ok('Hevy側の更新後も手動補正(kcal・メモ・強度)を保持しつつ原データは更新', w1.kcalOverride===250 && w1.note==='補正メモ' && w1.intensity==='vigorous' && w1.title==='Fictional Edited' && w1.durationMin===80);
    ok('手入力kcalがあればそれを優先して1回だけ反映', Calc.workoutKcal(w1,70).kcal===250 && Calc.workoutKcal(w1,70).method==='manual');
    const r3 = applyChanges(d2, [{kind:'upsert', workoutId:'W1', workout:hw('W1', {start_time:'2026-02-12T01:00:00Z', end_time:'2026-02-12T02:00:00Z'})}], ctx());
    ok('開始日が変わると日付を移動（古い日に残らない）', r3.moved===1 && d2.days['2026-02-10'].workouts.length===0 && d2.days['2026-02-12'].workouts.length===1);
    d2.days['2026-02-12'].workouts.push({id:'man1', source:'manual', title:'手入力', durationMin:30, metUsed:5, exercises:[]});
    d2.days['2026-02-12'].workouts.push({id:'oth', source:'hevy', accountKey:'acct2', externalId:'W1', title:'他アカウント', durationMin:30, metUsed:null, exercises:[]});
    const r4 = applyChanges(d2, [{kind:'delete', workoutId:'W1'}], ctx());
    ok('削除はHevy由来(同アカウント)だけ。手入力・他アカウントは残る', r4.deleted===1 && d2.days['2026-02-12'].workouts.map(w=>w.id).sort().join()==='man1,oth');
    const cond = {heightCm:175, sex:'male', birthDate:'1996-01-01', weightKg:70, activityId:'sedentary', tol:100};
    const bal = Calc.dayBalance('2026-02-10', {mealsComplete:true, meals:[{kcal:2000}], workouts:d.days['2026-02-10'].workouts}, cond);
    ok('未計算の筋トレは0kcal扱いではなく未算入として件数表示', bal.exerciseUncalculated===1 && bal.exercise===0);
    const d3 = mk(); applyChanges(d3, [{kind:'upsert', workoutId:'W1', workout:hw('W1')}], ctx({defaultIntensity:'moderate'}));
    applyChanges(d3, [{kind:'upsert', workoutId:'W1', workout:hw('W1')}, {kind:'upsert', workoutId:'W1', workout:hw('W1')}], ctx());
    const b3 = Calc.dayBalance('2026-02-10', {mealsComplete:true, meals:[{kcal:2000}], workouts:d3.days['2026-02-10'].workouts}, cond);
    ok('収支へは一度だけ反映（再同期・重複変更でも追加消費は233.3kcal、種目別は加算しない）', Math.abs(b3.exercise-233.333)<0.01 && b3.exerciseUncalculated===0 && Math.abs(b3.total-(b3.daily+233.333))<0.01);
    const d4 = mk(); applyChanges(d4, [{kind:'upsert', workoutId:'W9', workout:hw('W9')}], ctx());

    const d5 = mk(); applyChanges(d5, [{kind:'upsert', workoutId:'W1', workout:hw('W1')}], ctx());
    ok('未計算の記録へ既定強度を明示的に適用できる', applyDefaultIntensity(d5, 'light', nowIso)===1 && d5.days['2026-02-10'].workouts[0].metUsed===3.5);
    d5.days['2026-02-10'].workouts[0] = {...d5.days['2026-02-10'].workouts[0], intensity:'moderate', metUsed:null, calc:null};
    ok('強度名だけが残る旧記録は、その強度のMETを復元する', applyDefaultIntensity(d5, 'light', nowIso)===1 && d5.days['2026-02-10'].workouts[0].intensity==='moderate' && d5.days['2026-02-10'].workouts[0].metUsed===5);
    const f = templatesToFile([{id:'TEST-0001', title:'Fictional Bench Press (Barbell)', type:'weight_reps', primary_muscle_group:'chest', secondary_muscle_groups:['triceps'], equipment:'barbell', is_custom:false, thumbnail_url:'https://example.invalid/a.png'}], 'acct1', nowIso);
    const parsed = Ex.parseFile(f);
    ok('テンプレート→種目マスタ形式へ変換（画像URLは保持しない）', parsed.items.length===1 && parsed.items[0].thumbnailUrl===null && parsed.items[0].equipment==='barbell');
    ok('種目集計: Hevyセット詳細からボリューム 60×8=480（ウォームアップ除外）', exStats(rec.exercises[0]).vol===480 && exStats({weightKg:50, reps:10, sets:3}).vol===1500);
    return res;
  }
  return {dateInTz, timeInTz, elapsedMin, toLocal, applyChanges, purge, applyDefaultIntensity, templatesToFile, exStats, findRecord, CALC_VERSION, selfTest};
})();

<!-- ============ 画面モジュール ============ -->
<script id="view-js">
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v===''||v==null) return null; const n = Number(String(v).replace(',','.')); return isFinite(n) ? n : null; };
const fmt = (v, d=0) => v==null ? '—' : Number(v).toLocaleString('ja-JP', {maximumFractionDigits:d, minimumFractionDigits:0});
const sgn = v => (v>0?'+':v<0?'−':'±') + fmt(Math.abs(v));
const WD = ['日','月','火','水','木','金','土'];
const dlabel = s => { const d = Calc.parseDate(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };

const ui = {tab:'dash', date:Calc.today(), mview:'food', exq:'', exfilter:'all', exform:null, exImport:null, exmap:null, exmapq:'', dview:'chart', aview:'bal', lift:'', rep:{period:'30', detail:true, body:true}, range:7, calMonth:null, calFor:null, mform:null, wform:null, fform:null};
const newMform = () => ({meal:'breakfast', foodId:'', mode:'amount', amount:'', manualName:'', manualKcal:'', note:'', editId:null});
const newWform = () => ({editId:null, title:'', durationMin:'', intensity:'moderate', kcalOverride:'', note:'', exercises:[{name:'',weightKg:'',reps:'',sets:''}], source:'manual', externalId:null, importedAt:null});
const newFform = () => ({editId:null, name:'', baseAmount:'', unit:'g', kcal:'', note:''});
ui.mform = newMform(); ui.wform = newWform(); ui.fform = newFform();

let toastT;
function toast(m, err){ const t = document.getElementById('toast'); t.textContent = m; t.style.background = err?'#b91c1c':'#1d2733'; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none', 3200); }
function persist(){ if(!Store.save()) toast('保存できません（プライベートブラウズ等）。バックアップを取ってください', true); }

const STATUS = {
  over:{t:'オーバー', c:'over'}, under:{t:'アンダー', c:'under'}, maintain:{t:'ほぼ維持', c:'maintain'},
  provisional:{t:'暫定（食事記録が未完了）', c:'prov'}, unrecorded:{t:'未記録', c:'unrec'}, insufficient:{t:'判定に必要な情報が不足', c:'insuf'}
};

/* ---------- ダッシュボード ---------- */
function viewDash(){
  const d = ui.date, {cond, locked} = Store.condFor(d), b = Calc.dayBalance(d, Store.getDay(d), cond), st = STATUS[b.status];
  let head;
  if (b.status==='insufficient') head = `<div class="note err">判定に必要な情報が不足: ${esc(b.missing.join('、'))}。「設定」で入力してください。</div>`;
  else if (b.status==='unrecorded') head = `<span class="badge ${st.c}">${st.t}</span><div class="small">食事が未記録の日は、摂取0kcalとして判定しません。</div>`;
  else {
    const label = b.status==='provisional' ? `暫定 ${b.diff>0?'オーバー':'アンダー'}傾向` : st.t;
    head = `<span class="badge ${b.status==='provisional'?(b.diff>0?'over':'under'):st.c}">${label}</span>
      <div class="big ${b.status==='provisional'?'prov':st.c}">${sgn(b.diff)} kcal</div>
      <div class="small">差分 = 摂取 − 推定総消費（許容幅 ±${fmt(cond.tol)}kcal 以内なら「ほぼ維持」）${b.status==='provisional'?'<br>食事記録が未完了のため、これまでの記録分のみの暫定値です。':''}</div>`;
  }
  const rows = b.status==='insufficient' ? '' : `
    <div class="tiles"><div class="tile"><span>摂取${Store.getDay(d).mealsComplete?'':'（記録中）'}</span><b>${fmt(b.intake)}</b><small>kcal</small></div><div class="tile"><span>推定総消費</span><b>${fmt(b.total)}</b><small>kcal</small></div></div>
    <h3>消費の内訳</h3>
    <table>
      <tr><td>推定基礎代謝 (BMR)</td><td class="n">${fmt(b.bmr)} kcal</td></tr>
      <tr><td>日常活動を含む推定消費<div class="small">BMR × ${b.pal}（筋トレ除く）</div></td><td class="n">${fmt(b.daily)} kcal</td></tr>
      <tr><td>筋トレによる追加消費<div class="small">安静分を除いた正味</div></td><td class="n">+${fmt(b.exercise)} kcal${b.exerciseUncalculated?`<div class="small">未計算 ${b.exerciseUncalculated}件を除く</div>`:''}</td></tr>
      <tr class="sum"><td>1日の推定総消費</td><td class="n">${fmt(b.total)} kcal</td></tr>
    </table>`;
  const cinfo = b.status==='insufficient' ? '' : (b.exerciseUncalculated ? `<div class="note">筋トレの<b>未計算 ${b.exerciseUncalculated}件</b>（運動強度が未設定）。追加消費には算入されていないため、差分は実際より多めに出る可能性があります。「日次記録」で強度を選んでください。</div>` : '') + `<div class="small">計算条件: 体重 ${fmt(cond.weightKg,1)}kg・${esc(Calc.ACTIVITY.find(a=>a.id===cond.activityId).label)}・${locked?'この日に保存済みの条件':'現在の設定（記録すると保存されます）'}</div>`;
  return `${dateBar()}
    <div class="card"><h2>${esc(d)} の収支</h2>${head}${rows}${cinfo}
      <div class="note">消費カロリーと収支は推定値であり、実測値ではありません。</div></div>
    <div class="card"><h2>推移</h2>
      <div class="seg">${[['chart','グラフ'],['cal','カレンダー']].map(([k,l])=>`<button data-act="dview" data-id="${k}" class="${ui.dview===k?'on':''}">${l}</button>`).join('')}</div>
      ${ui.dview==='cal' ? calendar() : `<h3>直近7日間</h3>${chart()}
      <div class="small">棒は差分（上=オーバー、下=アンダー）。破線枠は暫定。“—”は未記録・情報不足で、0kcalとは区別しています。それ以前はカレンダーで確認できます。</div>`}</div>
    ${viewAnalysis()}`;
}
const SHORT = {over:'オーバー',under:'アンダー',maintain:'維持',provisional:'暫定',unrecorded:'未記録',insufficient:'情報不足'};
/* ---------- 分析 ---------- */
function viewAnalysis(){
  const tabs = [['bal','累積収支'],['wt','体重'],['lift','種目']];
  const body = {bal:anBalance, wt:anWeight, lift:anLift}[ui.aview]();
  return `<div class="card"><h2>分析</h2><div class="seg">${tabs.map(([k,l])=>`<button data-act="aview" data-id="${k}" class="${ui.aview===k?'on':''}">${l}</button>`).join('')}</div>${body}</div>`;
}
function anBalance(){
  const rows = [7,30].map(n => {
    const bs = []; for (let i=0;i<n;i++) bs.push(balanceOf(Calc.addDays(ui.date,-i)));
    const j = bs.filter(b=>['over','under','maintain'].includes(b.status)), sum = j.reduce((s,b)=>s+b.diff,0);
    return `<tr><td>直近${n}日<div class="small">判定済み ${j.length}日</div></td><td class="n">${j.length?sgn(sum)+' kcal':'—'}</td><td class="n">${j.length?(sum>0?'+':sum<0?'−':'±')+fmt(Math.abs(sum)/7200,2)+' kg':'—'}</td></tr>`;
  }).join('');
  return `<table><tr><th>期間（${esc(dlabel(ui.date))}まで）</th><th class="n">累積差分</th><th class="n">体脂肪換算</th></tr>${rows}</table>
    <div class="small">食事記録完了の日だけを合算（未完了・未記録・情報不足は除外）。体重換算は「7,200kcal≈1kg」の一般的な目安で、実際の体重変化とは一致しません。</div>`;
}
function anWeight(){
  const N = 30, days = []; for (let i=N-1;i>=0;i--) days.push(Calc.addDays(ui.date,-i));
  const W = Store.data.weights, raw = days.map(d=>W[d]??null);
  if (!raw.some(v=>v!=null)) return '<div class="small">この期間の体重記録がありません。「日次記録」で体重を入力してください。</div>';
  const ma = days.map((d,i) => { const v = []; for (let k=Math.max(0,i-6);k<=i;k++) if (raw[k]!=null) v.push(raw[k]); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; });
  const all = [...raw,...ma].filter(v=>v!=null), lo = Math.min(...all)-0.5, hi = Math.max(...all)+0.5;
  const Wd = 340, H = 140, px = i => 8 + i*(Wd-16)/(N-1), py = v => H-16 - (v-lo)/(hi-lo)*(H-32);
  const line = arr => arr.map((v,i)=>v==null?null:`${px(i).toFixed(1)},${py(v).toFixed(1)}`).filter(Boolean).join(' ');
  const dots = raw.map((v,i)=>v==null?'':`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3" fill="#8e8e93"/>`).join('');
  const last = raw.map((v,i)=>v!=null?i:-1).filter(i=>i>=0).pop(), lastMa = ma[last];
  const prevIdx = ma.map((v,i)=>v!=null&&i<=last-7?i:-1).filter(i=>i>=0).pop(), chg = prevIdx!=null ? lastMa-ma[prevIdx] : null;
  return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="体重推移">
    <text x="4" y="12" font-size="10" fill="#6c6c70">${fmt(hi,1)}kg</text><text x="4" y="${H-4}" font-size="10" fill="#6c6c70">${fmt(lo,1)}kg</text>
    <polyline points="${line(ma)}" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>
    <div class="small">グレーの点=記録した体重、緑の線=7日移動平均（直近30日）</div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><span>最新（${esc(dshort(days[last]))}）</span><b>${fmt(raw[last],1)}kg</b></div><div><span>7日平均</span><b>${fmt(lastMa,1)}kg</b></div><div><span>平均の7日前比</span><b>${chg==null?'—':(chg>0?'+':chg<0?'−':'±')+fmt(Math.abs(chg),1)+'kg'}</b></div></div>`;
}
function anLift(){
  const dates = Object.keys(Store.data.days).sort(), names = {};
  dates.forEach(d => Store.data.days[d].workouts.forEach(w => w.exercises.forEach(e => { const n = e.name.trim(); if (n) names[n] = d; })));
  const list = Object.keys(names).sort((a,b)=>names[b].localeCompare(names[a]));
  if (!list.length) return '<div class="small">種目の記録がありません。筋トレの種目（重量・回数・セット）を記録すると表示されます。</div>';
  if (!list.includes(ui.lift)) ui.lift = list[0];
  const rows = [];
  dates.forEach(d => {
    let max = 0, vol = 0, rm = 0, hit = false;
    Store.data.days[d].workouts.forEach(w => w.exercises.filter(e=>e.name.trim()===ui.lift).forEach(e => { hit = true; const s = HevySync.exStats(e); max = Math.max(max,s.max); vol += s.vol; rm = Math.max(rm, s.rm); }));
    if (hit) rows.push({d, max, vol, rm});
  });
  const shown = rows.slice(-12).reverse();
  const arrow = (a,b) => b==null ? '' : a>b ? ' ▲' : a<b ? ' ▼' : ' ＝';
  return `<label>種目</label><select data-f="lift" data-rerender>${list.map(n=>`<option ${n===ui.lift?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <table><tr><th>日付</th><th class="n">最大重量</th><th class="n">推定1RM</th><th class="n">ボリューム</th></tr>
    ${shown.map((r,i)=>{ const p = shown[i+1]; return `<tr><td>${esc(dshort(r.d))}</td><td class="n">${fmt(r.max,1)}kg${arrow(r.max,p&&p.max)}</td><td class="n">${fmt(r.rm,1)}kg${arrow(r.rm,p&&p.rm)}</td><td class="n">${fmt(r.vol)}kg${arrow(r.vol,p&&p.vol)}</td></tr>`; }).join('')}</table>
    <div class="small">最新12回分。ボリューム=重量×回数×セットの合計、推定1RM=重量×(1+回数/30)（Epley式・目安）。↑↓は前回比。種目名が完全一致するものを集計します。</div>`;
}
const LBL = s => (s==='provisional'||s==='insufficient') ? '' : SHORT[s];
const dshort = s => { const d = Calc.parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const balanceOf = x => { const {cond}=Store.condFor(x); return Calc.dayBalance(x, Store.getDay(x), cond); };
function stats(bs){
  const j = bs.filter(b=>['over','under','maintain'].includes(b.status));
  const cnt = s => bs.filter(b=>b.status===s).length;
  const avg = j.length ? j.reduce((s,b)=>s+b.diff,0)/j.length : null;
  return `<div class="stats"><div><span>平均差分（完了日）</span><b>${avg==null?'—':sgn(avg)}</b></div><div><span>オーバー</span><b>${cnt('over')}日</b></div><div><span>維持</span><b>${cnt('maintain')}日</b></div><div><span>アンダー</span><b>${cnt('under')}日</b></div></div>`;
}
function chart(){
  const n = ui.range, days = []; for (let i=n-1;i>=0;i--) days.push(Calc.addDays(ui.date,-i));
  const bs = days.map(balanceOf);
  const max = Math.max(300, ...bs.map(b=>b.diff==null?0:Math.abs(b.diff)));
  return stats(bs) + '<div class="chart">' + bs.map((b,i) => {
    const st = STATUS[b.status]; let bar='', txt;
    if (b.diff!=null && b.status!=='unrecorded') {
      const h = Math.max(2, Math.abs(b.diff)/max*50), up = b.diff>0, cls = b.status==='provisional' ? 'prov '+(up?'over':'under') : b.status;
      bar = `<div class="bar ${cls}" style="${up?'bottom':'top'}:50%;height:${h}%;${b.status==='provisional'?'color:'+(up?'var(--over)':'var(--under)'):''}"></div>`;
    }
    txt = b.diff==null || b.status==='unrecorded' ? '—' : sgn(b.diff);
    return `<button class="col ${days[i]===ui.date?'sel':''}" data-act="pick" data-id="${days[i]}"><div class="bars">${bar}</div><b class="${st.c}">${txt}</b><span class="${st.c}">${LBL(b.status)}</span><span class="dt">${dshort(days[i])}</span></button>`;
  }).join('') + '</div>';
}
function calendar(){
  if (ui.calFor !== ui.date) { ui.calMonth = ui.date.slice(0,7); ui.calFor = ui.date; }
  const [y, m] = ui.calMonth.split('-').map(Number), lead = new Date(y, m-1, 1).getDay(), last = new Date(y, m, 0).getDate();
  const cells = Array(lead).fill('<div class="cc empty"></div>'), bs = [];
  for (let i=1;i<=last;i++) {
    const d = `${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`, b = balanceOf(d); bs.push(b);
    const st = STATUS[b.status], txt = b.diff==null || b.status==='unrecorded' ? '—' : sgn(b.diff);
    cells.push(`<button class="cc bg-${st.c} ${d===ui.date?'sel':''} ${d===Calc.today()?'tod':''}" data-act="pick" data-id="${d}"><i>${i}</i><b class="${st.c}">${txt}</b><span class="${st.c}">${LBL(b.status)}</span></button>`);
  }
  return `<div class="calnav"><button data-act="cal-prev" aria-label="前月">◀</button><b>${y}年${m}月</b><button data-act="cal-next" aria-label="翌月">▶</button></div>
    ${stats(bs)}<div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells.join('')}</div>
    <div class="small">各日の数字は差分(kcal)。タップでその日を選択します。縦線なしの枠=今日、太枠=選択中。</div>`;
}
function dateBar(){
  return `<div class="datebar"><button data-act="date-prev" aria-label="前日">◀</button><input type="date" data-f="date" value="${esc(ui.date)}"><button data-act="date-next" aria-label="翌日">▶</button><button data-act="today">今日</button></div>`;
}

/* ---------- 日次記録 ---------- */
function viewDaily(){
  const d = ui.date, day = Store.getDay(d), {cond} = Store.condFor(d), b = Calc.dayBalance(d, day, cond), w = Store.weightFor(d);
  const mf = ui.mform, foods = Store.data.foods, food = foods.find(f=>f.id===mf.foodId);
  const byMeal = Calc.MEALS.map(m => {
    const items = day.meals.filter(x=>x.meal===m.id), sum = items.reduce((s,x)=>s+x.kcal,0);
    return `<h3>${m.label}　<span class="small">${fmt(sum)} kcal</span></h3>` + (items.length ? items.map(x=>`
      <div class="item"><div>${esc(x.name)}${x.foodId?` <span class="small">${fmt(x.amount,2)}${esc(x.unit)}</span>`:''}<br><span class="small">${fmt(x.kcal)} kcal${x.note?' ・ '+esc(x.note):''}</span></div>
      <div class="acts">${Store.data.foods.some(f=>f.id===x.foodId)?'':`<button class="sm" data-act="meal-to-master" data-id="${x.id}">マスタ登録</button>`}<button class="sm" data-act="meal-edit" data-id="${x.id}">編集</button><button class="sm danger" data-act="meal-del" data-id="${x.id}">削除</button></div></div>`).join('') : '<div class="small">記録なし</div>');
  }).join('');

  const wf = ui.wform;
  const wl = day.workouts.map(x => workoutItem(x, cond)).join('') || '<div class="small">筋トレなし</div>';
  const it = Calc.INTENSITY.find(i=>i.id===wf.intensity);

  return `${dateBar()}
  <div class="card"><h2>体重・食事記録の状態</h2>
    <label>この日の体重 (kg)${w&&w.date!==d?`（未入力のため ${esc(w.date)} の値を使用）`:''}</label>
    <div class="row"><input type="number" inputmode="decimal" step="0.1" id="wt" value="${Store.data.weights[d]??''}" placeholder="${w?fmt(w.kg,1):'例: 体重を入力'}"><button data-act="save-weight">体重を保存</button></div>
    <div class="opt"><input type="checkbox" id="complete" data-act="toggle-complete" ${day.mealsComplete?'checked':''}><label for="complete">食事記録完了（この日の食事をすべて入力済み）<br><span class="small">未完了の間は収支を「暫定」表示にします</span></label></div>
    <div class="small">摂取 ${fmt(b.intake)} kcal / ${b.status==='insufficient'?'判定に必要な情報が不足':STATUS[b.status].t}${b.diff!=null?'（差分 '+sgn(b.diff)+'）':''}</div>
  </div>

  <div class="card"><h2>食事</h2>
    <div class="btns" style="margin:0 0 6px"><button data-act="copy-prev">前日(${esc(dlabel(Calc.addDays(d,-1)))})の食事をコピー</button></div>
    <h3>${mf.editId?'食事を編集':'食事を追加'}</h3>
    <label>食事区分</label><select data-f="mform.meal">${Calc.MEALS.map(m=>`<option value="${m.id}" ${mf.meal===m.id?'selected':''}>${m.label}</option>`).join('')}</select>
    <label>食品・メニュー</label><select data-f="mform.foodId" data-rerender>
      <option value="">（マスタ未登録・直接入力）</option>${foods.map(f=>`<option value="${f.id}" ${mf.foodId===f.id?'selected':''}>${esc(f.name)}（${fmt(f.baseAmount,2)}${esc(f.unit)}=${fmt(f.kcal)}kcal）</option>`).join('')}</select>
    ${food ? `
      <div class="row"><div><label>入力方法</label><select data-f="mform.mode" data-rerender><option value="amount" ${mf.mode==='amount'?'selected':''}>量（${esc(food.unit)}）</option><option value="ratio" ${mf.mode==='ratio'?'selected':''}>倍率（×基準量）</option></select></div>
      <div><label>${mf.mode==='amount'?'量（'+esc(food.unit)+'）':'倍率（例: 1.5）'}</label><input type="number" inputmode="decimal" step="any" data-f="mform.amount" value="${esc(mf.amount)}" placeholder="${mf.mode==='amount'?fmt(food.baseAmount,2):'1'}"></div></div>`
    : `<div class="row"><div><label>名前</label><input data-f="mform.manualName" value="${esc(mf.manualName)}" maxlength="100"></div><div><label>カロリー (kcal)</label><input type="number" inputmode="decimal" step="any" data-f="mform.manualKcal" value="${esc(mf.manualKcal)}"></div></div>`}
    <label>メモ（任意）</label><input data-f="mform.note" value="${esc(mf.note)}" maxlength="200">
    <div class="small" id="mpreview" style="margin-top:6px"></div>
    <div class="btns"><button class="pri" data-act="meal-save">${mf.editId?'更新':'追加'}</button>${mf.editId?'<button data-act="meal-cancel">キャンセル</button>':''}</div>
    ${foods.length?'':'<div class="note">マスタが空です。「マスタ」画面で登録すると選ぶだけで記録できます。</div>'}
    <div style="margin-top:10px">${byMeal}</div>
    <table><tr class="sum"><td>1日合計</td><td class="n">${fmt(b.intake)} kcal</td></tr></table>
  </div>

  <div class="card"><h2>筋トレ</h2>
    <h3>${wf.editId?'筋トレを編集':'筋トレを追加'}</h3>
    <div class="note">消費カロリーは「セッション全体の所要時間×強度(MET)×体重」で推定します。重量・回数・セットは記録用で、計算には使いません（種目ごとの加算もしません）。所要時間は<b>開始〜終了の総時間（セット間休憩を含む）</b>を入力してください。</div>
    <label>セッション名</label><input data-f="wform.title" value="${esc(wf.title)}" placeholder="例: 胸の日" maxlength="100">
    <div class="row"><div><label>所要時間（分）</label><input type="number" inputmode="numeric" data-f="wform.durationMin" value="${esc(wf.durationMin)}"></div>
    <div><label>運動強度</label><select data-f="wform.intensity" data-rerender>${Calc.INTENSITY.map(i=>`<option value="${i.id}" ${wf.intensity===i.id?'selected':''}>${i.label}（MET ${i.met}）</option>`).join('')}</select></div></div>

function mealCalc(){
  const mf = ui.mform, food = Store.data.foods.find(f=>f.id===mf.foodId);
  if (!food) { const k = num(mf.manualKcal); return k==null?null:{kcal:k}; }
  const a = num(mf.amount); if (a==null) return null;
  const amount = mf.mode==='ratio' ? a*food.baseAmount : a;
  return {amount, kcal:Calc.scaleKcal(food.kcal, food.baseAmount, amount)};
}
function updatePreview(){
  const el = document.getElementById('mpreview'); if(!el) return;
  const c = mealCalc(); const food = Store.data.foods.find(f=>f.id===ui.mform.foodId);
  el.textContent = c ? (food ? `${fmt(c.amount,2)}${food.unit} → 約 ${fmt(c.kcal,1)} kcal` : `${fmt(c.kcal,1)} kcal`) : '';
}

}

    <div class="small">UTF-8(BOM付き)・全期間・1行目はヘッダー。日次サマリーはダッシュボードと同じ値（体重・基礎代謝・消費・摂取・差分・判定 status）です。status: over / under / maintain / provisional(暫定) / unrecorded(未記録) / insufficient(情報不足)。差分は摂取−推定総消費。空欄は「値なし」を表し0ではありません。筋トレの消費kcalはセッションCSVにのみあり、種目CSVとはsession_idで結合します（種目側にkcalは持たせず二重計上を防止）。</div></div>

  <div class="card"><h2>計算方法・出典</h2>
    <details open><summary>全体の式</summary><pre>推定総消費 = 基礎代謝 × 活動係数 + 筋トレ追加消費
差分 = 摂取 − 推定総消費（正=オーバー / 負=アンダー）
判定: |差分| ≤ 許容幅 → ほぼ維持</pre></details>
    <details><summary>基礎代謝: Mifflin-St Jeor式</summary><pre>男性: 10×体重(kg) + 6.25×身長(cm) − 5×年齢 + 5
女性: 10×体重(kg) + 6.25×身長(cm) − 5×年齢 − 161</pre>
      <div class="small">健常成人で他の一般式より推定誤差が小さいと報告されており、体重・身長・年齢・性別のみで使えるため採用。出典: Mifflin MD et al., Am J Clin Nutr 1990;51:241-247。個人差があり、体組成は反映されません。</div></details>
    <details><summary>日常活動係数</summary><div class="small">基礎代謝に掛ける係数です。<b>筋トレの時間は含めない日常動作のみ</b>を想定して選びます（${Calc.ACTIVITY.map(a=>a.label+'×'+a.pal).join('、')}）。筋トレは別枠で加算するため、レベル選択時に筋トレ分を上乗せして選ばないでください。係数は一般的な目安から本アプリで定めた仮定値です。</div></details>
    <details><summary>筋トレ消費: MET法</summary><pre>追加消費(kcal) = (MET − 1) × 体重(kg) × 時間(h)</pre>
      <div class="small">MET（総消費÷安静時）から安静分の1METを引いた正味分のみを加算するため、基礎代謝との二重計上を避けています（1MET≈1kcal/kg/時の慣例換算）。係数: ${Calc.INTENSITY.map(i=>`${i.label}=${i.met}（コード${i.code}）`).join('、')}。<br>
      出典: 2024 Adult Compendium of Physical Activities（Herrmann SD et al., J Sport Health Sci 2024）<a href="https://pacompendium.com/conditioning-exercise/" target="_blank" rel="noopener">Conditioning Exercise</a>。<br>
      適用条件: セッション全体の時間（休憩込み）に対する平均的な値で、重量・回数・セット数からは算出しません。種目ごとには加算しません。手入力の値がある場合はそちらを優先します。</div></details>
    <details><summary>Hevy連携の仕組みと制約</summary><div class="small">サーバー版（招待制ログイン）では、サーバーがAPIキーを暗号化して保管し、Hevy公式APIの <code>GET /v1/user/info</code>・<code>/v1/exercise_templates</code>・<code>/v1/workouts</code>・<code>/v1/workouts/events</code> だけを読み取りで呼びます（Hevyへの書き込みなし）。初回は直近90日を取り込み、以後は events（更新・削除）で差分同期します。削除は Hevy の削除イベントがあった記録だけに反映し、一覧に無いだけでは削除しません。ワークアウトIDで追加・更新するので再同期しても重複せず、手入力の記録や手動補正（強度・kcal・メモ）は保持されます。Hevyの履歴にあるのはワークアウト全体の開始・終了時刻で、種目ごとの動作時間は含まれないため、種目別の時間は仮定しません。種目マスタ単独の取り込み（<code>tools/fetch_hevy_exercises.py</code>）は、サーバーなしでも使えます。APIの利用条件はHevy公式で確認してください。</div></details>
  </div>
  <div class="card"><h2>計算の自己検証</h2><div class="btns" style="margin:0"><button data-act="selftest">検証を実行</button></div><div id="testout"></div></div>`;
}
