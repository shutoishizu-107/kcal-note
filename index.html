function repRange(){
  const t = Calc.today(), p = ui.rep.period;
  if (p==='month') return [t.slice(0,8)+'01', t];
  if (p==='prev') { const [y,m] = t.split('-').map(Number); return [Calc.fmtDate(new Date(y,m-2,1)), Calc.fmtDate(new Date(y,m-1,0))]; }
  if (p==='all') return [Csv.dates()[0]||t, t];
  return [Calc.addDays(t, -(+p-1)), t];
}
function buildReport(){
  const rep = ui.rep, [from, to] = repRange(); let dates = [];
  for (let d=from; d<=to; d=Calc.addDays(d,1)) dates.push(d);
  if (rep.period==='all') { const rec = new Set(Csv.dates()); dates = dates.filter(d=>rec.has(d)); }
  const rows = dates.map(d => ({d, day:Store.getDay(d), b:balanceOf(d), cond:Store.condFor(d).cond}))
    .filter(r => r.day.meals.length || r.day.workouts.length || r.day.mealsComplete || Store.data.weights[r.d]!=null);
  const empty = dates.length - rows.length;
  const j = rows.filter(r=>['over','under','maintain'].includes(r.b.status)), n = j.length;
  const avg = f => n ? j.reduce((s,r)=>s+f(r),0)/n : null;
  const cnt = s => rows.filter(r=>r.b.status===s).length;
  const sessions = rows.reduce((s,r)=>s+r.day.workouts.length,0), mins = rows.reduce((s,r)=>s+r.day.workouts.reduce((a,w)=>a+w.durationMin,0),0);
  const wk = rows.reduce((s,r)=>s+(r.b.exercise||0),0);
  const ws = Object.keys(Store.data.weights).filter(d=>d>=from&&d<=to).sort();
  const last = Store.condFor(to).cond, act = Calc.ACTIVITY.find(a=>a.id===last.activityId);
  const kv = (k,v) => `<div>${esc(k)}</div><div><b>${esc(v)}</b></div>`;
  const STX = {over:'オーバー',under:'アンダー',maintain:'ほぼ維持',provisional:'暫定',unrecorded:'未記録',insufficient:'情報不足'};
  let h = `<div class="rbar"><button class="pri" data-act="rep-print">PDF保存・印刷</button><button data-act="rep-close">閉じる</button></div>
    <h1>カロリー収支サマリー</h1><div class="small">期間: ${from} ～ ${to}（${dates.length}日）・作成日: ${Calc.today()}</div>
    <div class="note">消費カロリーと収支は推定値であり、実測値ではありません。差分＝摂取−推定総消費（正=オーバー、負=アンダー）。平均・累積は「食事記録完了」の日（判定済み）のみを対象とし、未記録・暫定の日は除外しています。</div>
    <h2>総括</h2><div class="kv">${kv('判定済み日数', n+'日')}${kv('オーバー / 維持 / アンダー', `${cnt('over')} / ${cnt('maintain')} / ${cnt('under')}日`)}
    ${kv('平均摂取', n?fmt(avg(r=>r.b.intake))+' kcal':'—')}${kv('平均推定総消費', n?fmt(avg(r=>r.b.total))+' kcal':'—')}
    ${kv('平均差分', n?sgn(avg(r=>r.b.diff))+' kcal':'—')}${kv('累積差分', n?sgn(j.reduce((s,r)=>s+r.b.diff,0))+' kcal':'—')}
    ${kv('暫定の日 / 記録なしの日', `${cnt('provisional')} / ${empty}日`)}${kv('情報不足の日', cnt('insufficient')+'日')}
    ${kv('筋トレ', `${sessions}回 / ${fmt(mins)}分 / 追加消費合計 ${fmt(wk)} kcal`)}
    ${rep.body && ws.length ? kv('体重（期間内の記録）', `${fmt(Store.data.weights[ws[0]],1)} kg (${ws[0]}) → ${fmt(Store.data.weights[ws[ws.length-1]],1)} kg (${ws[ws.length-1]})`) : ''}</div>
    <h2>計算条件</h2><div class="kv">${rep.body && last.heightCm ? kv('身長 / 性別 / 年齢', `${fmt(last.heightCm,1)}cm / ${last.sex==='male'?'男性':last.sex==='female'?'女性':'—'} / ${last.birthDate?Calc.ageOn(last.birthDate,to)+'歳':'—'}`) : ''}
    ${kv('日常活動レベル', act?`${act.label}（×${act.pal}、筋トレを含まない）`:'未設定')}${kv('「ほぼ維持」の許容幅', '±'+fmt(last.tol)+' kcal')}
    ${kv('基礎代謝', 'Mifflin-St Jeor式')}${kv('筋トレ消費', '(MET−1)×体重×時間（Compendium 2024）、手入力あれば優先')}</div>
    <h2>日別データ</h2><div class="tw"><table><tr><th>日付</th>${rep.body?'<th class="n">体重</th>':''}<th class="n">摂取</th><th class="n hm">基礎代謝</th><th class="n hm">日常活動込</th><th class="n">筋トレ</th><th class="n">総消費</th><th class="n">差分</th><th>判定</th></tr>
    ${rows.map(r=>{ const b=r.b, ok=b.status!=='insufficient'; return `<tr><td>${esc(dshort(r.d))}</td>${rep.body?`<td class="n">${r.cond.weightKg?fmt(r.cond.weightKg,1):'—'}</td>`:''}<td class="n">${b.mealCount||r.day.mealsComplete?fmt(b.intake):'—'}</td><td class="n hm">${ok?fmt(b.bmr):'—'}</td><td class="n hm">${ok?fmt(b.daily):'—'}</td><td class="n">${ok?fmt(b.exercise):'—'}</td><td class="n">${ok?fmt(b.total):'—'}</td><td class="n">${b.diff!=null&&b.status!=='unrecorded'?sgn(b.diff):'—'}</td><td>${STX[b.status]}</td></tr>`; }).join('')}</table></div>
    <div class="small">単位: kcal。「—」は値なし（0ではありません）。暫定=食事記録が未完了で確定していない日。記録のない日は表から省略しています。</div>`;
  if (rep.detail) {
    const dd = rows.filter(r=>r.day.meals.length||r.day.workouts.length);
    h += `<h2>食事・筋トレの詳細</h2>` + (dd.length ? dd.map(r => `<div class="dd"><b>${esc(dlabel(r.d))}</b>${r.day.mealsComplete?'':'（食事記録未完了）'}<br>
      ${Calc.MEALS.map(m=>{ const it = r.day.meals.filter(x=>x.meal===m.id); return it.length ? `${m.label}: ${it.map(x=>`${esc(x.name)}${x.foodId?' '+fmt(x.amount,2)+esc(x.unit):''} ${fmt(x.kcal)}kcal`).join('、')}<br>` : ''; }).join('')}
      ${r.day.workouts.map(w=>`筋トレ: ${esc(w.title||'(名称なし)')} ${fmt(w.durationMin)}分 強度${esc((Calc.INTENSITY.find(i=>i.id===w.intensity)||{}).label||'')} 消費${fmt(Calc.workoutKcal(w,r.cond.weightKg).kcal)}kcal${w.exercises.length?'（'+w.exercises.map(e=>`${esc(e.name)} ${e.weightKg}kg×${e.reps}×${e.sets}`).join('、')+'）':''}<br>`).join('')}</div>`).join('') : '<div class="small">記録なし</div>');
  }
  return h;
}

/* ---------- バックエンド連携（ログイン・Hevy） ---------- */
const Api = {
  available:false, user:null, csrf:null,
  async init(){
    if (!/^https?:$/.test(location.protocol)) return;
    try {
      const r = await fetch('/api/session', {credentials:'same-origin', cache:'no-store'});
      if (!r.ok || !(r.headers.get('content-type')||'').includes('json')) return;
      const j = await r.json();
      if (j.backend !== true) return;
      this.available = true; this.user = j.user; this.csrf = j.csrfToken;
    } catch(e) { /* バックエンドなし（静的配信・ローカル）として動く */ }
  },
  async call(method, path, body){
    try {
      const r = await fetch(path, {method, credentials:'same-origin', cache:'no-store', headers:{'Content-Type':'application/json', ...(this.csrf?{'X-CSRF-Token':this.csrf}:{})}, body:body===undefined?undefined:JSON.stringify(body)});
      let data = {}; try { data = await r.json(); } catch(e) {}
      if (r.status===401 && this.user) { toast('セッションが切れました。再ログインしてください', true); setTimeout(()=>location.reload(), 1200); }
      return {ok:r.ok, status:r.status, data};
    } catch(e) { return {ok:false, status:0, data:{message:'サーバーに接続できません'}}; }
  }
};

// GitHub Pages 等の静的配信で行う、Hevy 公式APIへのブラウザ接続テスト。
// APIキーはこのオブジェクト（ページを開いている間のメモリ）だけに保持する。
const DirectHevy = {
  key:'', testing:false, result:null, endpointResults:null,
  async request(path){
    const response = await fetch('https://api.hevyapp.com' + path, {
      method:'GET', mode:'cors', cache:'no-store', headers:{'api-key':this.key, 'Accept':'application/json'}
    });
    let data = null; try { data = await response.json(); } catch(e) {}
    if (!response.ok) throw new Error(`${path}: Hevy が HTTP ${response.status} を返しました`);
    if (!data || typeof data!=='object') throw new Error(`${path}: JSONオブジェクトではありません`);
    return data;
  },
  async test(){
    const field = document.getElementById('hv-direct-key');
    const key = field ? field.value.trim() : this.key;
    if (!key) throw new Error('Hevy APIキーを入力してください');
    this.key = key; this.testing = true; this.result = null; render();
    try {
      // api-key ヘッダーにより、ブラウザは OPTIONS のプリフライト後に GET を行う。
      const data = await this.request('/v1/user/info');
      if (!data || !data.data || typeof data.data.id!=='string') throw new Error('Hevyのアカウント情報の形式が想定と異なります');
      this.result = {ok:true, account:{name:typeof data.data.name==='string'?data.data.name:'', username:typeof data.data.username==='string'?data.data.username:''}};
    } catch(e) {
      // CORS違反時はブラウザが詳細を開示しないため、ここにAPIキーや応答本文は出さない。
      this.result = {ok:false, message:e instanceof TypeError ? 'ブラウザがHevyへの通信を許可しませんでした（CORSまたはネットワークの問題）。開発者ツールのConsole/NetworkでOPTIONSとGETを確認してください。' : (e.message || '接続テストに失敗しました')};
    } finally { this.testing = false; render(); }
  },
  async testEndpoints(){
    if (!this.key) throw new Error('先に接続テストを実行してください');
    this.testing = true; this.endpointResults = null; render();
    try {
      const templates = await this.request('/v1/exercise_templates?page=1&pageSize=1');
      if (!Array.isArray(templates.exercise_templates)) throw new Error('/v1/exercise_templates: exercise_templates 配列がありません');
      const workouts = await this.request('/v1/workouts?page=1&pageSize=1');
      if (!Array.isArray(workouts.workouts)) throw new Error('/v1/workouts: workouts 配列がありません');
      const events = await this.request('/v1/workouts/events?since=1970-01-01T00%3A00%3A00Z&page=1&pageSize=1');
      // 現行仕様の events と、実サービスで確認済みの workouts 応答を区別して記録する。
      const eventShape = Array.isArray(events.events) ? 'events' : Array.isArray(events.workouts) ? 'workouts（更新記録として扱う互換形式）' : null;
      if (!eventShape) throw new Error('/v1/workouts/events: events / workouts 配列がありません');
      this.endpointResults = {ok:true, eventShape};
    } catch(e) {
      this.endpointResults = {ok:false, message:e instanceof TypeError ? 'ブラウザがHevyへの通信を許可しませんでした（CORSまたはネットワークの問題）。' : (e.message || 'エンドポイント検証に失敗しました')};
    } finally { this.testing = false; render(); }
  }
};

const AUTO_SYNC_AFTER_MS = 15*60*1000, MIN_CLIENT_SYNC_MS = 20*1000;
const Hevy = {
  st:null, syncing:false, error:'', lastRun:0, testOk:null, changingKey:false, disc:false, lastSummary:null,
  async refresh(){ const r = await Api.call('GET', '/api/hevy/status'); if (r.ok) this.st = r.data; return r.ok; },
  async start(){ await this.refresh(); render(); if (this.st && this.st.connected && this.st.autoSync) this.sync(); },
  async sync({mode='incremental', days, manual=false}={}){
    if (this.syncing || !(this.st && this.st.connected)) return;
    if (!manual && Date.now()-this.lastRun < MIN_CLIENT_SYNC_MS) return;
    this.syncing = true; this.error = ''; render();
    try {
      const r = await Api.call('POST', '/api/hevy/sync', {mode, days});
      if (r.ok) { this.lastSummary = r.data.summary; if (r.data.status) this.st = r.data.status; }
      else if (!['too_soon','busy'].includes(r.data.error)) throw new Error(r.data.message || '同期に失敗しました');
      await this.pull();
    } catch(e) { this.error = e.message || '同期に失敗しました'; }
    finally { this.syncing = false; this.lastRun = Date.now(); await this.refresh(); render(); }
  },
  // サーバーの変更履歴を、前回位置から順に取り込む。1バッチごとに保存し、途中で止まっても安全。
  async pull(){
    const H = Store.data.hevy; let guard = 0;
    for (;;) {
      if (++guard > 300) throw new Error('変更が多すぎるため一旦中止しました。もう一度同期してください');
      const r = await Api.call('GET', `/api/hevy/changes?after=${H.seq}` + (H.generation!=null ? `&generation=${H.generation}` : ''));
      if (!r.ok) throw new Error(r.data.message || '履歴の取得に失敗しました');
      const d = r.data;
      if (H.accountKey && H.accountKey !== d.accountKey) {
        if (confirm('連携先のHevyアカウントが以前と異なります。\nOK: 以前のアカウント由来のHevy記録をこの端末から削除する\nキャンセル: 以前の記録は残し、別アカウントの記録として分けて保持する')) HevySync.purge(Store.data, H.accountKey);
        H.seq = 0; H.generation = null; H.accountKey = d.accountKey; H.templatesAt = null; persist(); continue;
      }
      if (!H.accountKey) H.accountKey = d.accountKey;
      if (d.generationChanged) { HevySync.purge(Store.data, H.accountKey); H.seq = 0; H.generation = d.generation; persist(); continue; }
      H.generation = d.generation;
      HevySync.applyChanges(Store.data, d.changes, {accountKey:d.accountKey, tz:Store.data.settings.timezone, defaultIntensity:Store.data.settings.hevyDefaultIntensity, uid:Store.uid, nowIso:new Date().toISOString(), onDate:date=>Store.lockCond(date)});
      H.seq = d.nextSeq; persist();
      if (!d.hasMore) break;
    }
    await this.refresh();
    if (this.st && this.st.templatesAt && this.st.templatesAt !== H.templatesAt) await this.pullTemplates();
    H.lastSyncAt = new Date().toISOString(); persist();
  },
  async pullTemplates(){
    const r = await Api.call('GET', '/api/hevy/templates');
    if (!r.ok) return;
    const f = HevySync.templatesToFile(r.data.templates, r.data.accountKey, r.data.fetchedAt);
    const parsed = Ex.parseFile(f), plan = Ex.planImport(parsed, Store.data.exercises);
    Ex.applyImport(plan, Store.data.exercises, Store.uid, r.data.fetchedAt);
    Store.data.hevy.templatesAt = this.st.templatesAt;
    // 種目マスタが増えたあとに、既存のHevy記録の種目IDへの紐づけだけを補う（記録の中身は変えない）
    for (const d of Object.values(Store.data.days)) for (const w of d.workouts) if (w.source==='hevy') for (const e of w.exercises) if (!e.exerciseId && e.hevyTemplateId) {
      const m = Store.data.exercises.find(x=>x.source==='hevy' && x.hevy.templateId===e.hevyTemplateId && (!x.hevy.isCustom || x.hevy.accountKey===w.accountKey)); if (m) e.exerciseId = m.id;
    }
    persist();
  }
};

function download(name, text, type='application/json'){

/* CSV: 1行目はヘッダー、数値は素の数値、テキストは引用符でエスケープ */
const Csv = {
  cell(v, text){
    if (v==null) return '';
    let s = typeof v==='number' ? String(Math.round(v*100)/100) : String(v);
    if (text && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  },
  build(head, rows){ return [head.map(h=>h[0]).join(','), ...rows.map(r => r.map((v,i)=>Csv.cell(v, head[i][1])).join(','))].join('\r\n') + '\r\n'; },
  dates(){ return [...new Set([...Object.keys(Store.data.days), ...Object.keys(Store.data.weights)])].sort(); },
  daily(){
    const head = [['date'],['weight_kg'],['weight_source_date'],['height_cm'],['sex'],['age'],['activity_level'],['activity_factor'],['tolerance_kcal'],['conditions_locked'],
      ['bmr_kcal'],['daily_expenditure_kcal'],['workout_kcal'],['total_expenditure_kcal'],['intake_kcal'],['balance_kcal'],['status'],['meals_complete'],['meal_count'],['workout_count']];
    const rows = Csv.dates().map(d => {
      const day = Store.getDay(d), {cond, locked} = Store.condFor(d), b = Calc.dayBalance(d, day, cond), w = Store.weightFor(d);
      const age = cond.birthDate ? Calc.ageOn(cond.birthDate, d) : null;
      return [d, cond.weightKg, locked ? (Store.data.weights[d]!=null?d:null) : (w?w.date:null), cond.heightCm, cond.sex||null, age, cond.activityId||null, b.pal??null, cond.tol, locked?1:0,
        b.bmr, b.daily, b.exercise, b.total, b.intake, b.diff, b.status, day.mealsComplete?1:0, day.meals.length, day.workouts.length];
    });
    return Csv.build(head, rows);
  },
  meals(){
    const head = [['date'],['meal_type'],['name',1],['food_id'],['amount'],['unit',1],['base_amount'],['base_kcal'],['kcal'],['note',1],['entry_id']];
    const rows = [];
    Csv.dates().forEach(d => Store.getDay(d).meals.forEach(m => rows.push([d, m.meal, m.name, m.foodId, m.amount, m.unit, m.baseAmount, m.baseKcal, m.kcal, m.note, m.id])));
    return Csv.build(head, rows);
  },
  sessions(){
    const head = [['date'],['session_id'],['title',1],['duration_min'],['intensity'],['met'],['kcal_method'],['workout_kcal'],['exercise_count'],['source'],['external_id'],['imported_at'],['note',1]];
    const rows = [];
    Csv.dates().forEach(d => { const w0 = Store.condFor(d).cond.weightKg; Store.getDay(d).workouts.forEach(w => { const k = Calc.workoutKcal(w, w0);
      rows.push([d, w.id, w.title, w.durationMin, w.intensity, w.metUsed, k.method, k.kcal, w.exercises.length, w.source, w.externalId, w.importedAt, w.note]); }); });
    return Csv.build(head, rows);
  },
  exercises(){
    const head = [['date'],['session_id'],['exercise_index'],['exercise_name',1],['weight_kg'],['reps'],['sets'],['volume_kg'],['exercise_id'],['hevy_template_id']];
    const rows = [];
    Csv.dates().forEach(d => Store.getDay(d).workouts.forEach(w => w.exercises.forEach((e,i) => rows.push([d, w.id, i+1, e.name, e.weightKg, e.reps, e.sets, HevySync.exStats(e).vol, e.exerciseId, e.hevyTemplateId]))));
    return Csv.build(head, rows);
  }
};
function readFile(input, cb){
  const f = input.files[0]; input.value=''; if(!f) return;
  if (f.size > 5e6) return toast('ファイルが大きすぎます', true);
  const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch(e){ toast('読み込み失敗: '+e.message, true); } }; r.readAsText(f);
}
const posNum = (v, label, {min=0, max=Infinity, req=true, gt0=false}={}) => {
  const n = num(v);
  if (n==null) { if (req) throw new Error(label+'を入力してください'); return null; }
  if (n<min || n>max || (gt0 && n<=0)) throw new Error(`${label}が範囲外です`);
  return n;
};

}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName==='INPUT' && el.type==='checkbox' && e.type!=='change') return;
  if (el.tagName==='INPUT') return;
  run(el);
});
function run(el){
  try {
    const r = actions[el.dataset.act](el);
    if (r && typeof r.then==='function') { r.then(()=>render()).catch(err=>{ toast(err.message, true); render(); }); return; }
    if (r !== 'noRender') render();
  } catch(err){ toast(err.message, true); render(); }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act==='toggle-complete' || t.dataset.act==='hv-autosync') { run(t); return; }
  if (t.id==='foodfile') readFile(t, o => {
    if (!o || !Array.isArray(o.foods)) throw new Error('マスタJSONの形式が不正です');
    const items = o.foods.map(f => Store.validateFood(f, m=>{throw new Error(m);}));
    if (!confirm(`${items.length}件を読み込みます。同名の項目は上書き、それ以外は追加します。よろしいですか？`)) return;
    items.forEach(it => { const i = Store.data.foods.findIndex(f=>f.name===it.name); if (i>=0) Store.data.foods[i] = {...it, id:Store.data.foods[i].id}; else Store.data.foods.push({...it, id:Store.uid()}); });
    persist(); render(); toast('インポートしました');
  });
  if (t.id==='allfile') readFile(t, o => {
    Store.validate(o);
    if (!confirm('現在の全データを、読み込んだバックアップで上書きします。よろしいですか？')) return;
    Store.replaceAll(o); render(); toast('復元しました');
  });
  if (t.id==='exfile') readFile(t, o => {
    const parsed = Ex.parseFile(o);
    ui.exImport = {parsed, plan:Ex.planImport(parsed, Store.data.exercises)}; render();
  });
  if (t.dataset.f==='date') { if (Calc.parseDate(t.value)) { ui.date = t.value; render(); } }
  else if (t.dataset.f && t.dataset.rerender!==undefined) { setPath(t.dataset.f, t.type==='checkbox' ? t.checked : t.value); if (t.dataset.f==='mform.foodId') { ui.mform.amount=''; ui.mform.mode='amount'; } render(); }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.f || t.dataset.f==='date' || t.dataset.rerender!==undefined) return;
  setPath(t.dataset.f, t.type==='checkbox' ? t.checked : t.value); if (t.dataset.f.startsWith('mform.')) updatePreview();
});

function registerSW(){
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW) location.reload(); });
  }
}

  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));

  if (ui.inviteToken) history.replaceState(null, '', location.pathname); // 招待トークンをURLに残さない
  await Api.init();
  if (Api.available) {
    if (!Api.user) { showAuth(); render(); registerSW(); return; }
    ui.inviteToken = null;
    Store.setNamespace('u' + Api.user.id); // アカウントごとに保存領域を分ける
    if (!Store.hasOwnData() && Store.legacyExists() && confirm('この端末に、ログイン前から保存されていた既存データがあります。このアカウントのデータとして引き継ぎますか？\n（他の人のデータの可能性がある場合は「キャンセル」）')) Store.adoptLegacy();
  }
  Store.load();
  render();
  registerSW();
  if (Api.user) {
    Hevy.start();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState==='visible' && Hevy.st && Hevy.st.connected && Hevy.st.autoSync && Date.now()-Hevy.lastRun > AUTO_SYNC_AFTER_MS) Hevy.sync();
    });
  }
}
boot();
</script>
</body>
</html>
